- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxRifle762 #FH
  name: ammunition box (7.62 rifle) #FH
  description: 120 round box of 7.62 Rifle ammunition. #Far Horizons
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeRifle762 #FH
    proto: CartridgeRifle762SP #FH
    capacity: 120 #FH - 4x mag size
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Boxes/Rifle/7.62.rsi #FH
  - type: MagazineVisuals
    magState: mag
    steps: 9 #FH
    zeroVisible: false
  - type: Appearance


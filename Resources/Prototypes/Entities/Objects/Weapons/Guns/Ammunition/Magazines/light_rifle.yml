# Empty mags
- type: entity
  id: BaseMagazineRifle762 #FH
  parent: [ BaseItem, BaseSecurityContraband ]
  abstract: true
  name: "magazine (7.62 rifle)" #FH
  components:
  - type: Tag
    tags:
      - MagazineRifle762 #FH
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeRifle762 #FH
    proto: CartridgeRifle762SP #FH
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Magazine/Rifle/akms.rsi #FH
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Magazines
- type: entity
#FH Edit - Start
  id: MagazineRifle762BoxSP
  name: L6 SAW Magazine Box (7.62 rifle SP)
  parent: BaseMagazineRifle762
  description: Box containing a 100-round belt of linked 7.62 rifle rounds, used by light machine guns such as the L6. Intended to hold general-purpose kinetic ammunition.
#FH Edit - End
  components:
  - type: Tag
    tags:
      - MagazineRifle762Box #FH
  - type: BallisticAmmoProvider
    proto: CartridgeRifle762SP #FH
    capacity: 100
  - type: Item
  - type: Sprite
#FH Edit - Start
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Magazine/LMG/7.62.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: sp
#FH Edit - End
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance



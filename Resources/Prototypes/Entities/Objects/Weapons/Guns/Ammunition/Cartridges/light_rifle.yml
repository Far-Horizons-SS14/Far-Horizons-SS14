- type: entity
  id: BaseCartridgeRifle762SP #FH
  name: cartridge (7.62 rifle SP) #FH
  parent: [ BaseCartridge, BaseSecuritySalvageContraband ] #Far Horizons
  abstract: true
  components:
  - type: Tag
    tags:
    - CartridgeRifle762 #FH
  - type: CartridgeAmmo
    proto: BulletRifle762TraceSP #FH
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: CartridgeRifle762SP #FH
  name: cartridge (7.62 rifle SP) #FH

- type: entity
  abstract: true
  parent: BaseCartridge
  id: BaseShellShotgun
  name: 12 gauge shotgun shell # Starlight change: .50 -> 12 gauge
  components:
  - type: Tag
    tags:
    - ShellShotgun
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals
    revealSpent: true # Starlight

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityBartenderContraband ]
  id: ShellShotgunBeanbag
  name: 12 Gauge Beanbag Shell #FH Just call it beanbag nerd
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#FBEF06" #FH These are usually see through, but, in absence of that yellow is apparently a good color.
      - state: spent
        map: [ "enum.AmmoVisualLayers.Spent" ]
        visible: false
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
    proto: PelletShotgunBeanbagTrace

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityContraband]
  id: ShellShotgunSlug
  name: 12 Gauge Slug #FH - Captalization
  components:
  - type: Sprite
    layers:
      - state: base #FH
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip-long
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#164B31" #FH 99.9% of video games have these green.
      - state: spent-long
        map: [ "enum.AmmoVisualLayers.Spent" ]
        visible: false
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
    proto: PelletShotgunSlugTrace


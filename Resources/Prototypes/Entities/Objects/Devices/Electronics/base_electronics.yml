- type: entity
  id: BaseElectronics
  parent: [BaseItem, SolutionElectronicsEdibleFood] # FH - inherit from SolutionElectronicsEdibleFood so we avoid race where Edible adds food solution as well if run first
  name: base electronics
  abstract: true
  suffix: Electronics
  components:
  - type: Item
    storedRotation: -90
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: generic
  - type: PhysicalComposition
    materialComposition:
      Glass: 150 # FH reduced so price isn't too high with added solutionss
    chemicalComposition:
      Silicon: 20
  - type: Circuitboard
#FH - Start
  - type: Edible
    requiresSpecialDigestion: true
    delay: 3
    forceFeedDelay: 10
  - type: FlavorProfile
    flavors:
    - shocking
  - type: Extractable
    grindableSolutionName: ramchip
  - type: SolutionManager
    solutions:
    - SolutionElectronicsRamChip
  - type: Tag
    tags:
    - RamChip #Protogen joke, makes them able to eat them.

- type: entity
  parent: SolutionFood
  id: SolutionElectronicsEdibleFood
  abstract: true
  components:
  - type: Solution
    solution:
      maxVol: 15
      reagents:
      - ReagentId: BatteryAcid
        Quantity: 15

- type: entity
  parent: Solution
  id: SolutionElectronicsRamChip
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: ramchip
    solution:
      maxVol: 60
      reagents:
      - ReagentId: BatteryAcid
        Quantity: 12
      - ReagentId: Gold
        Quantity: 8
      - ReagentId: Iron
        Quantity: 8
      - ReagentId: Silicon
        Quantity: 30

#FH - End

- type: entity
  id: BaseMachineCircuitboard
  parent: [BaseItem, SolutionElectronicsEdibleFood] # FH - direct food solution avoids the Edible initialization race
  name: machine board
  abstract: true
  suffix: Machine Board
  components:
    - type: MachineBoard
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: generic
    - type: Item
      storedRotation: -90
    - type: StaticPrice
      price: 100
    - type: PhysicalComposition
      materialComposition:
        Glass: 230
      chemicalComposition:
        Silicon: 20
    - type: Circuitboard
#FH - Start
    - type: Edible
      requiresSpecialDigestion: true
      delay: 3
      forceFeedDelay: 10
    - type: FlavorProfile
      flavors:
      - shocking
    - type: Extractable
      grindableSolutionName: ramchip
    - type: SolutionManager
      solutions:
      - SolutionElectronicsRamChip
    - type: Tag
      tags:
      - RamChip #Protogen joke, makes them able to eat them.
#FH - End

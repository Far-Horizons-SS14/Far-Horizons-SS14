- type: entity
  id: UraniumWindow
  name: Uranium Window #Far Horizons - The Great Capitalization Crusade
  suffix: "NT" #FH
  parent: [BaseDeltaPressurePlasma, WindowRCDResistant]
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _FarHorizons/Structures/Windows/NanoTrasen/uranium_window.rsi #FH
  - type: Icon
    sprite: _FarHorizons/Structures/Windows/NanoTrasen/uranium_window.rsi #FH
    state: full
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassUranium:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    base: uwindow
  - type: Construction
    graph: Window
    node: uraniumWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 200
  - type: RadiationBlocker
    resistance: 3
  - type: Paintable #FH start
    group: UraniumWindow 
  - type: GenericPaintable #FH end

- type: entity
  id: UraniumWindowDirectional
  parent: [BaseDeltaPressurePlasmaQuarter, WindowDirectionalRCDResistant]
  name: Directional Uranium Window #Far Horizons - The Great Capitalization Crusade
  description: Don't smudge up the glass down there.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Windows/directional.rsi
    state: uranium_window
  - type: Icon
    sprite: _FarHorizons/Structures/Windows/directional.rsi
    state: uranium_window
  - type: Construction
    graph: WindowDirectional
    node: uraniumWindowDirectional
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 1.5
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassUranium:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 100
  - type: RadiationBlocker
    resistance: 1.5

- type: entity
  parent: UraniumWindow
  id: UraniumWindowDiagonal
  suffix: Diagonal, NT #Far Horizons - The Great Capitalization Crusade
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _FarHorizons/Structures/Windows/NanoTrasen/uranium_window_diagonal.rsi #FH
    state: state0
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
    mode: Diagonal
    key: walls #FH
    base: state
  - type: Icon
    sprite: _FarHorizons/Structures/Windows/NanoTrasen/uranium_window_diagonal.rsi #FH
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks_diagonal.rsi
  - type: Construction
    graph: WindowDiagonal
    node: uraniumWindowDiagonal
  - type: Paintable #FH start
    group: UraniumWindowDiagonal 
  - type: GenericPaintable #FH end

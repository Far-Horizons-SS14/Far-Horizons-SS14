- type: antag
  id: SpaceNinja
  name: roles-antag-space-ninja-name
  antagonist: true
  setPreference: true # Starlight - allow setting pref for ninja
  objective: roles-antag-space-ninja-objective
  guides: [ SpaceNinja ]
  # Starlight start
  previewStartingGear: SpaceNinjaGear
  requirements:
  - !type:OverallPlaytimeRequirement #Far Horizons
    time: 7200 # 2 hours - Far Horizons
#  - !type:DepartmentTimeRequirement #Far Horizons
#    department: Security
#    time: 3h
  playTimeTracker: AntagNinja
  # Starlight end

- type: antagSpecifier
  parent: RestrictedAntag
  id: SpaceNinja
  prefRoles: [ SpaceNinja ]
  spawnerPrototype: SpawnPointGhostSpaceNinja
  pickPlayer: false
  startingGear: SpaceNinjaGear
  roleLoadout:
  - RoleSurvivalSpaceNinja
  briefing:
    text: ninja-role-greeting
    color: Green
    sound: /Audio/Misc/ninja_greeting.ogg
  components:
  - type: SpaceNinja
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: AutoImplant
    implants:
    - DeathAcidifierImplant
  - type: RandomMetadata
    nameSegments:
    - NamesNinjaTitle
    - NamesNinja
    nameFormat: name-format-ninja
  - type: ThermalVision # FH
  mindRoles:
  - MindRoleNinja

#Ninja Gear
- type: startingGear
  id: SpaceNinjaGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitNinja
    back: ClothingBackpackSatchelNinja
    mask: ClothingMaskNinja
    head: ClothingHeadHelmetSpaceNinja
    eyes: ClothingEyesVisorNinja
    gloves: ClothingHandsGlovesSpaceNinja
    outerClothing: ClothingOuterSuitSpaceNinja
    shoes: ClothingShoesSpaceNinja
    id: AgentIDCard
    ears: ClothingHeadsetNinja # Starlight #FH, the green headset is better
    pocket1: SpiderCharge
    pocket2: PinpointerStation
    belt: EnergyKatana
  inhand:
    - JetpackBlackFilled
  storage:
    back: # belt holds katana so satchel has the tools for sabotaging things
    - Crowbar
    - Wrench
    - Screwdriver
    - Wirecutter
    - Welder
    - Multitool
    - EmergencyMedipen
    - Flare
    - FoodSnackNutribrick
    - DrinkWaterBottleFull

- type: chameleonOutfit
  id: NinjaChameleonOutfit
  name: roles-antag-space-ninja-name
  icon: "JobIconNinja"
  startingGear: SpaceNinjaGear
  equipment:
    id: AssistantPDA
    neck: ClothingNeckGoldmedal

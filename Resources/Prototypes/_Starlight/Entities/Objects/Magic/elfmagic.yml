# Luminous Orb

- type: entity
  name: Luminous Orb
  parent: BaseItem
  id: ElfLuminousOrb
  description: Destined to burn out and fade away.
  components:
  - type: Item
    sprite: _Starlight/Objects/Magic/luminous_orb.rsi
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: Sprite
    sprite: _Starlight/Objects/Magic/luminous_orb.rsi
    layers:
    - state: icon
      shader: unshaded
      map: [ "enum.ColorVisuals.Color" ]
  - type: PointLight
    radius: 4
    color: "#00CCFF"
  - type: TimedDespawn
    lifetime: 225
  - type: TileFrictionModifier
    modifier: 0.001
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Starlight/Magic/cantrip.ogg
  - type: StaticPrice
    price: 0 # Not sellable.
  - type: Appearance
  - type: ColorVisuals

# Ember

- type: entity
  name: Ember
  parent: BaseItem
  id: ElfMagicEmber
  description: Careful! It's hot. Cannot be dropped. Will decay soon.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Magic/ember.rsi
    layers:
    - state: icon
      shader: unshaded
      map: [ "enum.ColorVisuals.Color" ] #FH
  - type: Item
    sprite: _Starlight/Objects/Magic/ember.rsi
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: PointLight
    radius: 1.5 #FH
    energy: 4 #FH
    color: "#93F02E"
  - type: Unremoveable
  - type: SurgeryTool
  - type: Cautery
    speed: 2.0 #FH
    startSound:
      path: /Audio/_Starlight/Medical/Surgery/cautery1.ogg
    endSound:
      path: /Audio/_Starlight/Medical/Surgery/cautery2.ogg
  - type: IgnitionSource
    ignited: true
  - type: TimedDespawn
    lifetime: 5
  - type: AlwaysHot
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Starlight/Magic/ember.ogg
  - type: StaticPrice
    price: 0 # Not sellable.
#Far Horizons-Start
  - type: Appearance
  - type: ColorVisuals
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Heat: 5
        #Far Horizons-End

# Antidote

- type: entity
  id: ElfAntidoteSeed
  name: Rejuvenating Rune #Far Horizons
  parent: [ SolutionHypospray, SolutionVeryTiny ]
  description: A rune of radiant life energy, useful for restoring vitality to plants. Will evaporate soon if not used. #Far Horizons
  components:
  - type: Item
    sprite: _Starlight/Objects/Magic/antidote.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
    size: Tiny
  - type: Sprite
    sprite: _Starlight/Objects/Magic/antidote.rsi
    layers:
    - state: icon
      map: ["enum.SolutionContainerLayers.Fill"]
      shader: unshaded
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: icon-empty
  - type: ExaminableSolution
    solution: hypospray
  - type: TimedDespawn
    lifetime: 15 # Not stockpileable.
  - type: PointLight
    radius: 1
    energy: 8
    color: "#93F02E"
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: null
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: Unremoveable
  - type: StaticPrice
    price: 0 # Not sellable.
  - type: DeleteOnSolutionEmpty
    solution: pen
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Starlight/Magic/cantrip.ogg
  - type: Solution # FH - migrated from SolutionContainerManager
    solution:
      reagents:
      - ReagentId: ElfDiethylamine
        Quantity: 15

# Cleanse

- type: entity
  parent: BaseFoam
  id: ElfCleanseSmoke
  name: Cleansing Aura #Far Horizons
  categories: [ HideSpawnMenu ]
  components:
  - type: Smoke
    spreadAmount: 1
  - type: PointLight
    enabled: true
    radius: 2
    energy: 8
  - type: LightFade
    duration: 1
  - type: Sprite
    sprite: Fluids/wet_floor_sparkles.rsi
    state: sparkles
  - type: TimedDespawn
    lifetime: 3
  - type: Tag
    tags:
    - HideContextMenu
  - type: EmitSoundOnSpawn
    sound: 
      path: "/Audio/_Starlight/Magic/gust.ogg"
      params:
        volume: 0.1
        variation: 0.5
  - type: Solution # FH - migrated from SolutionContainerManager
    solution:
      maxVol: 15
      canReact: true
      reagents:
      - ReagentId: ElfSpaceCleaner
        Quantity: 15

# Hemostasis

- type: entity
  name: Haemostatic Rune #Far Horizons
  description: A rune that stops bleeding when applied. Will fade if not used quickly. #Far Horizons
  parent: [ BaseHealingItem, SolutionHypospray, SolutionVeryTiny ]
  id: ElfRuneHaemostatic
  components:
  - type: Item
    sprite: _Starlight/Objects/Magic/antidote.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
    size: Tiny
  - type: Sprite
    sprite: _Starlight/Objects/Magic/bandage.rsi
    layers:
    - state: icon
      map: ["enum.SolutionContainerLayers.Fill"]
      shader: unshaded
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: icon-empty
  - type: ExaminableSolution
    solution: hypospray
  - type: TimedDespawn
    lifetime: 15 # Not stockpileable.
  - type: PointLight
    radius: 1
    energy: 8
    color: "#93F02E"
  - type: Injector
    solutionName: hypospray
    currentTransferAmount: null
    activeModeProtoId: SyringeInjectMode # Far Horizons - nerfs
    allowedModes:
    - SyringeInjectMode # Far Horizons - nerfs
  - type: Unremoveable
  - type: StaticPrice
    price: 0 # Not sellable.
  - type: DeleteOnSolutionEmpty
    solution: hypospray
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Starlight/Magic/ember.ogg
  - type: Solution # FH - migrated from SolutionContainerManager
    solution:
      reagents:
      - ReagentId: Inaprovaline # Far Horizons - nerfing it further
        Quantity: 15

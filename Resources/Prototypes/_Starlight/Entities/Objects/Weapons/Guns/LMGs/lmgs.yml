- type: entity
  name: DP-28 LMG
  id: WeaponLightMachineGunDP28
  parent: [BaseWeaponLightMachineGun, BaseSovietContraband]
  description: From RA-TA-TA-TA with love. Uses 7.62 ammo. #FH
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/LMGs/DP28/DP28_x64x32.rsi #FH
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
#FH - Start
    sprite: _FarHorizons/Objects/Weapons/Guns/LMGs/DP28/DP28_x32.rsi
    quickEquip: false
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/LMGs/DP28/DP28_x32.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
#FH - End
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/m41_cock.ogg
    soundBoltClosed: 
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
    soundBoltOpened: 
      path: /Audio/Weapons/Guns/Cock/shotgun_open.ogg
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifle762Maxim #FH
        insertSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        ejectSound: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
        priority: 2 #FH
        whitelist:
          tags:
            - MagazineRifle762Pan #FH
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifle762SP #FH
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle762 #FH
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: Gun
    minAngle: 20
    maxAngle: 27
    angleIncrease: 2
    angleDecay: 10
    fireRate: 5
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/dp28.ogg
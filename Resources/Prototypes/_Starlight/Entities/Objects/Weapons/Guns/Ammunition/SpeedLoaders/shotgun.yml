- type: entity
  id: BaseSpeedLoaderShotgun
  name: 12 Gauge Speedloader #FH
  parent: [ BaseItem ]
  abstract: true
  components:
  - type: Tag
    tags:
      - SpeedLoaderShotgun
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    mayTransfer: true
    fillDelay: 0.1
    whitelist:
      tags:
        - ShellShotgun
    capacity: 8 #FH
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
#FH - Start
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    storedOffset: 0,1
#FH - End
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Shotgun/12g_speed_loader.rsi #FH
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-8 #FH
        map: [ "enum.GunVisualLayers.Mag" ]
      - state: base-tip-8 #FH
        map: [ "enum.GunVisualLayers.Tip" ]
        color: "#F4001F"
  - type: MagazineVisuals
    magState: base
    steps: 9
    zeroVisible: false
  - type: Appearance


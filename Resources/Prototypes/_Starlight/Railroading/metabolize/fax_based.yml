# Conditions

- type: entity
  id: CrewCondition
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: Conditions
    conditions:
    - !type:SubjectSpeciesCondition
      blacklist:
      - Abductor
      - Skeleton
    # FH - removed brighteye as antagonist
    # - !type:SubjectMindAntagCondition
    #   blacklist:
    #   - Brighteye
      
# Example(Smokeable) Prototype

- type: entity
  id: RRCardCriminal
  parent: CrewCondition
  categories: [ HideSpawnMenu ]
  components:
  - type: RailroadCard
    title: rr-criminal
    icon: ""
    iconColor: "#fd3f3f" # Antag
    color: "#6c15ae" # Mythical
    image: /Textures/_Starlight/Railroading/criminal.png
    description: rr-criminal-desc
  - type: RailroadFaxOnChosen
    addresses: 
    - Captain's Office
    - Captain
    - Security
    - Bridge
    - Conference Room
    - HoS Office
    - Warden's Office
    - Warden
    - Detective's Office
    - Magistrate
    - CFL #FH
    - Commandant's Office #FH
    - Commandant #FH
    - Security Main #FH
    - Overwatch Lobby (Aegis) #FH 
    - Constable's Office #FH
    - Constable #FH
    - Investigator's Office #FH
    - Investigator #FH
    - Marshal's Office #FH
    - Marshal #FH
    - High Command #FH
    - Central Command #FH
    - NSHC #FH
    letters:
    - name: rr-criminal-letter-name
      content: rr-criminal-1-letter-content
      paperPrototype: PaperNTCC
      stampState: "paper_stamp-magistrate" #FH
      stampedBy:
        - stampedColor: "#FF5297" #FH
          stampedName: rr-cfa-a #FH
  - type: RailroadFaxOnFailed
    addresses: 
    - Captain's Office
    - Captain
    - Security
    - Bridge
    - Conference Room
    - HoS Office
    - Warden's Office
    - Warden
    - Detective's Office
    - Magistrate
    - CFL #FH
    - Commandant's Office #FH
    - Commandant #FH
    - Security Main #FH
    - Overwatch Lobby (Aegis) #FH 
    - Constable's Office #FH
    - Constable #FH
    - Investigator's Office #FH
    - Investigator #FH
    - Marshal's Office #FH
    - Marshal #FH
    - High Command #FH
    - NSHC #FH
    - Central Command #FH
    letters:
    - name: rr-criminal-failed-name
      content: rr-criminal-failed-content
      paperPrototype: PaperNTCC
      stampState: "paper_stamp-magistrate" #FH
      stampedBy:
        - stampedColor: "#FF5297" #FH
          stampedName: rr-cfa-a #FH
  - type: RailroadAssignRole
    role: RRMindRoleCriminal
  - type: RailroadModifyIdCard
    title: Criminal
    icon: "JobIconPrisoner"
  - type: RailroadMessageOnChosen
    messages:
    - message: rr-criminal-message
      wrapped: rr-criminal-wrapped-message
      color: "#fd3f3f"
  - type: RailroadTimerTask
    duration: 1200
  - type: RailroadSurviveTask
  - type: RailroadAvoidHandcuffsTask
  - type: RailroadDeliveryReward
    delivery: PackageDeliveryRewardSyndicateLetter
    dataset: railroadingDeliveryMessages
    wrappedDataset: railroadingDeliveryWrappedMessages
  - type: RailroadDonationReward
    amount: # 20 min survival
      min: 200
      max: 300
- type: antagSpecifier
  id: AbductorScientist
  pickPlayer: false
  spawnerPrototype: AbductorScientistSpawner
  startingGear: AbductorScientistGear
  briefing:
    text: abductor-role-greeting
    color: Green
    sound: /Audio/_Starlight/Misc/abductor.ogg
  components:
  - type: Abductor
  - type: Muted
  - type: AbductorScientist
  - type: ActionGrant
    actions:
    - ActionReturnToShip
  - type: Tag
    tags:
    - Abductor
    - AbductorScientist
    - CanPilot
  - type: NpcFactionMember
    factions:
    - Abductor
  mindRoles:
  - MindRoleScientistAbductor


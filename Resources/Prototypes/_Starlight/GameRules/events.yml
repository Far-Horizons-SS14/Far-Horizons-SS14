- type: entity
  parent: BaseAntagGhostRoleRule
  id: AbductorsSpawn
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 3
    minimumPlayers: 10
    duration: null
  - type: AntagObjectives
    objectives:
    - AbductObjective
  - type: AntagLoadProfileRule
    speciesHardOverride: Abductor
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: AbductorScientist
    - !type:FixedAntagCount
      proto: AbductorAgent
  # Far Horizons start
  # The order of thise is important, startup events get executed from bottom up
  # Loading map after loading ghost roles leads to bugs
  # Yes, it is stupid
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/_FarHorizons/Shuttles/ShuttleEvent/FHAbductorShuttle.yml 
  # Far Horizons end
      

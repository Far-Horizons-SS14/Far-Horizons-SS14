#region ## NanoTrasen ##

- type: entity # TODO implement sirens
  parent: [BaseBorgChassis, BaseSecBorgTransponder]
  id: BorgChassisSecuritySelectable
  name: Security Cyborg
  description: A special chassis produced by Nanotrasen to aid station side security forces in their duties.
  components:
  - type: TextToSpeech
  - type: RandomMetadata
    nameSegments:
    - NamesBorg
  - type: NpcFactionMember
    factions:
    - NanoTrasenSilicon
  - type: ShowJobIcons
  - type: ShowCrewIcons
  - type: InteractionPopup
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: Sprite
    sprite: _FarHorizons/Mobs/Silicon/Chassis/security.rsi
    layers:
    - state: borg
      map: [ "movement", "enum.BorgVisualLayers.Body" ]
    - state: borg_e_r
      map: [ "enum.BorgVisualLayers.Light" ]
      shader: unshaded
      visible: false
    - state: borg_l
      shader: unshaded
      map: [ "light","enum.BorgVisualLayers.LightStatus" ]
      visible: false
  - type: BorgChassis
    maxModules: 0
    hasMindState: borg_e
    noMindState: borg_e_r
  - type: BorgSwitchableType
    inherentRadioChannels:
    - Binary
    - Common
    availableTypes:
    - security
  - type: SiliconLawProvider
    laws: Robocop

- type: entity
  parent: BaseBorgChassisNotIonStormable
  id: BaseNTNCChassis
  name: NT-NC
  description: A special chassis produced by Nanotrasen to aid Centcom forces in their duties.
  save: false
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Silicon/Chassis/NTNC_Borg.rsi
  - type: TextToSpeech
  - type: RandomMetadata
    nameSegments:
    - NamesBorg
  - type: NpcFactionMember
    factions:
    - NanoTrasenSilicon
  - type: ShowJobIcons
  - type: InteractionPopup
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: Speech
    speechVerb: Robotic
    speechSounds: Xenoborg
    allowedEmotes:
    - Laugh
  - type: Vocal
    sounds:
      Unsexed: UnisexSiliconXenoborg
  - type: FlashImmunity
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - CentCom
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - GSL # Far Horizons
    - CFA # Far Horizons
  - type: ActiveRadio
    channels:
    - Binary
    - CentCom
    - Common
    - Command
    - Engineering
    - Medical
    - Science
    - Security
    - Service
    - GSL # Far Horizons
    - CFA # Har Horizons
  - type: SiliconLawProvider
    laws: NTNCLawset
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
    - Silicon
  - type: ShowHealthIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons

- type: entity
  parent: BaseNTNCChassis
  id: NTNCBorgChassisHAW
  name: NT-NC H.A.W
  description: A special chassis produced by Nanotrasen to aid Centcom forces in their duties. The H.A.W (Hazardous Assault Walker) features heavy armaments and a specialised access configurator designed to grant immediate entry.
  components:
  - type: TextToSpeech
  - type: Sprite
    layers:
      - state: borg
      - state: borg_e
        map: ["enum.BorgVisualLayers.Light"]
        shader: unshaded
        visible: false
      - state: borg_l
        shader: unshaded
        map: ["light"]
        visible: false
  - type: BorgChassis
    maxModules: 5
    moduleWhitelist:
      tags:
        - BorgModuleGeneric
        - BorgModuleCentcomm
        - BorgModuleEngineering
    hasMindState: borg_e
    noMindState: borg_e_r
  - type: MobThresholds # tankier
    thresholds:
      0: Alive
      150: Critical
      300: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: InteractionPopup
    interactSuccessString: petting-success-syndicate-cyborg
    interactFailureString: petting-failure-syndicate-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg

- type: entity
  parent: BaseNTNCChassis
  id: NTNCBorgChassisSOSU
  name: NT-NC S.O.S.U
  description: A special chassis produced by Nanotrasen to aid Centcom forces in their duties. The S.O.S.U (Special Operations Sentry Unit) specializes in covert operations and sabotaged and is equipped with several modules to aid it in this task.
  components:
  - type: TextToSpeech
  - type: Sprite
    sprite: _FarHorizons/Mobs/Silicon/Chassis/ntnc_sosu.rsi
    layers:
      - state: borg
        map: ["body"]
      - state: borg_e
        map: ["enum.BorgVisualLayers.Light", "activeLight"]
        shader: unshaded
        visible: false
      - state: borg_l
        shader: unshaded
        map: ["light"]
        visible: false
  - type: BorgChassis
    maxModules: 5
    moduleWhitelist:
      tags:
        - BorgModuleGeneric
        - BorgModuleCentcomm
        - BorgModuleEngineering
    hasMindState: borg_e
    noMindState: borg_e_r
  - type: InteractionPopup
    interactSuccessString: petting-success-syndicate-cyborg
    interactFailureString: petting-failure-syndicate-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: NightVision
  - type: OptionsVisualizer
    visuals:
      body:
      - options: Default
        data: {state: borg}
      - options: ReducedMotion
        data: {state: borg_static}
      light:
      - options: Default
        data: {state: borg_l}
      - options: ReducedMotion
        data: {state: borg_l_static}
      activeLight:
      - options: Default
        data: {state: borg_e}
      - options: ReducedMotion
        data: {state: borg_e_static}
      noMindState:
      - options: Default
        data: {state: borg_e_r}
      - options: ReducedMotion
        data: {state: borg_e_r_static}
  - type: MovementAlwaysTouching # it flies in space with tiny thrusters
  - type: FootstepModifier # it flies instead of walking
    footstepSoundCollection:
      collection: FootstepHoverXenoborg

#region ## NeoSol ##

- type: entity
  abstract: true
  id: BaseBorgTransponderNS
  components:
  - type: TextToSpeech
  - type: BorgTransponder
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CyborgControlNS
    transmitFrequencyId: RoboticsConsoleNS
    savableAddress: false
  - type: TimerTrigger
    delay: 10
    examinable: false
    beepSound:
      path: /Audio/Effects/Cargo/buzz_two.ogg
      params:
        volume: -4
  # prevent any funnies if someone makes a cyborg item...
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  # explosion does most of its damage in the center and less at the edges
  - type: Explosive
    explosionType: Minibomb
    deleteAfterExplosion: false # let damage threshold gib the borg
    totalIntensity: 30
    intensitySlope: 20
    maxIntensity: 20
    canCreateVacuum: false # its for killing the borg not the station
  - type: SpaceRescuePingSender
    color: "#2f88ff"


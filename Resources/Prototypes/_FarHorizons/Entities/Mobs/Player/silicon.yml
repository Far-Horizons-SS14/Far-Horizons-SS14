- type: entity
  id: StationAiBrainNS
  parent: StationAiBrain
  categories: [ HideSpawnMenu, DoNotMap ]
  suffix: NS
  components:
  - type: Access
    groups:
    - AllAccessNS
    - SiliconNS

- type: entity
  id: PlayerStationAiNS
  parent: PlayerStationAiEmptyNS
  suffix: Job spawn, NS
  components:
  - type: ContainerSpawnPoint
    containerId: station_ai_mind_slot
    job: StationAi

- type: entity
  id: PlayerStationAiEmptyNS
  parent: PlayerStationAiEmpty
  name: AI core
  description: The latest in Artificial Intelligences.
  suffix: Empty, NS
  components:
  - type: ContainerComp
    proto: AiHeldNS

- type: entity
  id: AiHeldNS
  description: Components added / removed from an entity that gets inserted into an AI core.
  parent: AiHeld
  categories: [ HideSpawnMenu ]
  components:
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - SyndiCommand
    - SyndiSec
    - SyndiEngi
    - SyndiSci
    - SyndiMed
    - SyndiService
    - SyndiCommon
    - GSL
    - CFA 
  - type: ActiveRadio
    channels:
    - Binary
    - SyndiCommand
    - SyndiSec
    - SyndiEngi
    - SyndiSci
    - SyndiMed
    - SyndiService
    - SyndiCommon
    - GSL
    - CFA 
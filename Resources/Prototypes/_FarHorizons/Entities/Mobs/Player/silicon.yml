#AI
- type: entity
  id: StationAiBrainSyndicate
  parent: StationAiBrain
  suffix: NeoSol
  components:
  - type: Access
    groups:
    - AllAccessNS
    - SiliconNS

# Borgs
- type: entity
  id: PlayerSecBorgChassis
  parent: BorgChassisSecuritySelectable
  suffix: Battery
  components:
  - type: ContainerFill
    containers:
      borg_brain:
      - PositronicBrain
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: StartingMindRole
    mindRole: "MindRoleSiliconBrain"
    silent: true

# NTNC
- type: entity
  id: PlayerBorgHAWBattery
  parent: NTNCBorgChassisHAW
  suffix: Battery, module
  components:
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - BorgModuleAdvancedTool
        - CentcommAccessBreakerModule
        - CentcommLaserModule
        - CentcommBulwarkModule
        - CentcommModuleSpaceMovement
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor

- type: entity
  id: PlayerBorgSOSUBattery
  parent: NTNCBorgChassisSOSU
  suffix: Battery, module
  components:
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
      borg_module:
        - BorgModuleAdvancedTool
        - CentcommAccessBreakerModule
        - CentcommLaserModule
        - CentcommModuleChameleonProjector
        - CentcommModuleCloakDevice
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
  - type: GhostTakeoverAvailable


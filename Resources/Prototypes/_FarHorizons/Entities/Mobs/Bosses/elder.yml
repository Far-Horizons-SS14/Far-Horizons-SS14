- type: entity
  name: Elder
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat ]
  id: MobElder
  components:
    - type: Sprite
      sprite: _Starlight/Mobs/Abyss/elder.rsi
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: elder
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: ElderCompound
      blackboard:
        VisionRadius: !type:Single
          18
        AggroVisionRadius: !type:Single
          30
    - type: NpcFactionMember
      factions:
      - Abyss
    - type: CombatMode
    - type: LimbTargetting
    - type: Physics
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 1.80
          density: 80
          mask:
            - FlyingMobMask
          layer:
            - FlyingMobLayer
    - type: MobState
    - type: MobThresholds
      thresholds:
        0: Alive
        2500: Dead
    - type: Stamina
      baseCritThreshold: 2000
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTypeTrigger
          damageType: Blunt
          damage: 3000
        behaviors:
        - !type:GibBehavior { }
      - trigger:
          !type:DamageTypeTrigger
          damageType: Heat
          damage: 3000
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawnInContainer: true
          spawn:
            Ash:
              min: 1
              max: 1
        - !type:BurnBodyBehavior
        - !type:PlaySoundBehavior
          sound:
            collection: MeatLaserImpact
    - type: MovementSpeedModifier
      baseWalkSpeed: 2.5
      baseSprintSpeed: 3.5
    - type: DamageStateVisuals
      states:
        Alive:
          Base: elder
        Dead:
          Base: dead
    - type: MeleeWeapon
      altDisarm: false
      attackRate: 0.5
      angle: 90
      range: 3
      animation: WeaponElderSlash
      soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
      damage:
        types:
          Slash: 20
          Structural: 60
    - type: TypingIndicator
      proto: alien
    - type: Tag
      tags:
        - DoorBumpOpener
    - type: ReplacementAccent
      accent: genericAggressive
    - type: Speech
      speechVerb: LargeMob
    - type: NoSlip
    - type: StatusEffects # Overwriting basesimplemob to remove flash, getting flashed as dragon just feelsbad
      allowed:
      - SlowedDown
      - Stutter
      - Electrocution
      - ForcedSleep
      - TemporaryBlindness
      - Pacified
      - RadiationProtection
      - Drowsiness
    - type: Butcherable
      spawned:
      - id: AbyssCore
        amount: 1
    - type: NPCUseActionOnTarget
      actionId: ActionMobBlink
    - type: BossCombat
      mechanics: ElderBossMechanics

- type: entity
  name: Elder
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat ]
  id: MobElderDecoy
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Starlight/Mobs/Abyss/elder.rsi
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: elder
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 1.80
          density: 80
          mask:
            - FlyingMobMask
          layer:
            - FlyingMobLayer
    - type: HTN
      rootTask:
        task: ElderDecoyCompound
    - type: ElderBossDecoy # Every time you break the clone - boss is healed
      bossHealing:
        types:
          Piercing: -50
          Slash: -50
          Blunt: -50
      explosionTelegraph: TelegraphBossElderDecoyExplosion # And then clone explodes
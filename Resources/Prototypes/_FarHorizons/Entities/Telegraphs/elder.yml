#region Warning Shot
# Attack that targets everyone, places a utility telegraph on them (organge)
# when that runs out, same shape is placed under character's feet which will first damage, then leave lingering damaging field
- type: entity
  id: TelegraphBossElderWarningShotPre
  categories: [ HideSpawnMenu ]
  components:
    - type: TelegraphedAttack
      kind: Utility
      telegraphs:
        - effectDelay: 2
          tiles: &warning_shot_tiles
            - -2, 0
            - -1, -1
            - -1, 0
            - -1, 1
            - 0, -2
            - 0, -1
            - 0, 0
            - 0, 1
            - 0, 2
            - 1, -1
            - 1, 0
            - 1, 1
            - 2, 0
    - type: TelegraphFollowupAttackOnTrigger
      entity: TelegraphBossElderWarningShotMain

- type: entity
  id: TelegraphBossElderWarningShotMain
  categories: [ HideSpawnMenu ]
  components:
    - type: TelegraphedAttack
      telegraphs:
        - effectDelay: 1
          tiles: *warning_shot_tiles
    - type: TelegraphDealDamageOnTrigger
      damage:
        types:
          Slash: 5
          Blunt: 15
          Cold: 5
          Structural: 100
    - type: TelegraphFollowupAttackOnTrigger
      entity: TelegraphBossElderWarningShotLingering
    - type: TelegraphSpawnVFXEntityOnTrigger
      entity: EffectGravityPulse
    - type: TelegraphPlaySoundOnTrigger
      sound:
        path: /Audio/Items/Defib/defib_zap.ogg

- type: entity
  id: TelegraphBossElderWarningShotLingering
  categories: [ HideSpawnMenu ]
  components:
    - type: TelegraphedAttack
      continuous: true
      telegraphs:
        - effectDelay: 10
          tiles: *warning_shot_tiles
    - type: TelegraphDealDamageOnTrigger
      damage:
        types:
          Blunt: 5
          Cold: 5
          Structural: 10
    - type: Sprite
      sprite: _FarHorizons/VFX/void_flame.rsi
      layers:
        - state: void_flame
          shader: unshaded
      scale: 2, 2
    - type: AmbientSound
      enabled: true
      volume: 0
      range: 15
      sound:
        path: /Audio/Items/Flare/flare_burn.ogg
        params:
          loop: true


- type: entity
  parent: BaseSubdermalImplant
  id: TrackingImplantNS
  name: Tracking Implant (NS)
  description: This implant has a tracking device attached to the suit sensor network, as well as a condition monitor for the Security radio channel.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      whitelist:
        components:
        - MobState # admeme implanting a chair with tracking implant needs to give the chair mobstate so it can die first
    - type: SuitSensor
      randomMode: false
      controlsLocked: true
      mode: SensorCords
      activationContainer: "implant"
    - type: DeviceNetwork
      deviceNetId: Wireless
      transmitFrequencyId: SuitSensor
    - type: StationLimitedNetwork
    - type: WirelessNetworkConnection
      range: 500
    #region Starlight Tracker rattle
    - type: TriggerOnMobstateChange
      mobState:
      - ActiveCritical
      - Critical
    - type: RattleOnTrigger
      targetUser: true
      radioChannel: SyndiSec
    #endregion Starlight tracker rattle

- type: entity
  parent: BaseSubdermalImplant
  id: ConsortiumUplinkImplant
  name: Consortium uplink implant
  description: This implant lets the user access a hidden Consortium uplink at will.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenUplinkImplant
    whitelist:
      components:
      - Hands
  - type: RemoteStore
    proto: StorePresetConsortiumRemoteUplink
    currency: Refinedbluespacecrystal
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
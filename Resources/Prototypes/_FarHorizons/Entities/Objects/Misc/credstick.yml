- type: entity
  parent: BaseItem
  id: CredstickEmpty
  name: Credstick
  description: A universal device for storing credits. It glows faintly when it's has money on it.
  components:
    - type: Sprite
      sprite: _FarHorizons/Objects/Misc/credstick.rsi
      layers:
      - state: credstick
      - map: [ "lights" ]
        state: lights
        shader: "unshaded"
        visible: false
    - type: Item
      size: Tiny
    - type: Tag
      tags:
      - Credstick
    - type: PhysicalComposition
      materialComposition:
        Plastic: 10
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PolygonShape
            vertices:
            - -0.3,0.1
            - -0.1,0.3
            - 0.3,-0.1
            - 0.1,-0.3
          density: 20 # derived from base_item
          mask:
          - ItemMask
          restitution: 0.3
          friction: 0.2
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.CredstickContentsState.Empty:
          lights:
            True: {visible: false}
            False: {visible: true}
    - type: Credstick
    - type: UserInterface
      interfaces:
        enum.CredstickTransferUi.DialogKey:
          type: CredstickTransferDialogBui
    - type: CredstickDirectTransferTarget

- type: entity
  parent: CredstickEmpty
  id: CredstickDeluxeEmpty
  name: Deluxe Credstick
  description: A universal device for storing credits. Plated with fake gold, it marks you as bank's valuable customer.
  components:
    - type: Sprite
      layers:
      - state: credstick_gold
      - map: [ "lights" ]
        state: lights
        shader: "unshaded"
        visible: false

- type: entity
  parent: CredstickEmpty
  id: CredstickPremiumEmpty
  name: Premium Credstick
  description: A universal device for storing credits. Platinum credstick is the true display of status and prestige.
  components:
    - type: Sprite
      layers:
      - state: credstick_platinum
      - map: [ "lights" ]
        state: lights
        shader: "unshaded"
        visible: false


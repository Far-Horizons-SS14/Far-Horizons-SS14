        - type: EyeCursorOffset
          maxOffset: 5
          pvsIncrease: 0.5
        - type: Wieldable
          unwieldOnUse: false
        - type: UseDelay
          delay: 2
        - type: SpeedModifiedOnWield
          walkModifier: 0.90
          sprintModifier: 0.90
        - type: AmmoCounter
        - type: GunWieldBonus
          minAngle: -9
          maxAngle: -15
        - type: Gun
          minAngle: 10
          maxAngle: 20
          pump: true
          fireRate: 3.5 # ~ 66.5 / 58.5 DPS respectively, though I really have my doubts someone is going to be able to do this three and a half times in a second with the pump.
          selectedMode: SemiAuto
          availableModes:
          - SemiAuto
          soundGunshot:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1.ogg
            params:
              variation: 0.246
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - CartridgeLightRifle
           - CartridgeLightRifleImprovised
           - CartridgeRifle556
          capacity: 35
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

      9mm: !type:ItemSwitchState
        verb: 9mm
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_2325/model_2325_x64x64.rsi

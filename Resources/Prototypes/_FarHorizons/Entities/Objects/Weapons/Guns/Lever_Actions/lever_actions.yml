#region =Base=
- type: entity
  name: Swordfish Lever-Action
  parent: [BaseWeaponSniper, BaseGunWieldable]
  id: WeaponLeverActionBase
  abstract: true
  components:
  - type: KnockbackByUserTag
    doestContain:
      Skating:
        knockback: 1
        staminaMultiplier: 50
      Resomi:
        knockback: 3
        staminaMultiplier: 15
      Avali:
        knockback: 1
        staminaMultiplier: 15
      Felionoid:
        knockback: 1
        staminaMultiplier: 15
      Animal:
        knockback: 3
        staminaMultiplier: 15
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_1989/model_1989_x64x32.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_1989/model_1989_x32.rsi
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_1989/model_1989_x32.rsi
    size: Normal
    shape:
    - 0,0,4,0
    storedOffset: 0,-1
  - type: Gun # 5-10 Deviation (Stock)
    fireRate: 1.5 
    minAngle: 10
    maxAngle: 20
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: GunWieldBonus
    minAngle: -5
    maxAngle: -10
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMagnum
      - CartridgeMagnumImprovised
      - CartridgeLightRifle
      - CartridgeLightRifleImprovised
    capacity: 12
    proto: CartridgeMagnumSP
  - type: Wieldable
    unwieldOnUse: false

#region =Neutral=






#region Swordfish
- type: entity
  name: Swordfish Lever-Action
  parent: [WeaponLeverActionBase, BaseSecurityContraband]
  id: WeaponLeverActionStock
  description: Used by some law enforcement agencies on the frontier where strong firepower reliably delivered matters more than an automatic firearm. Accepts .30 and .44 Magnum cartridges.
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMagnum
      - CartridgeMagnumImprovised
      - CartridgeLightRifle
      - CartridgeLightRifleImprovised
    capacity: 12
    proto: CartridgeMagnumSP
  #type: Attachments (or smth)
  #- Stock/Barrel (- 10 Max / - 5 Min)
  #- Large Ammo Tube (12 RNDs)
  #Modifiers:
  #- Lever Action (- 1 Knockback)
  #- Sniper (+1 Tile Range)

#region Wooden Swordfish
- type: entity
  name: Wooden Swordfish Lever-Action
  parent: [WeaponLeverActionBase]

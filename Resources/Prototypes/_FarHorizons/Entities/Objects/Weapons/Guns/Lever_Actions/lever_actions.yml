#region =NanoTrasen=





#region Swordfish Type-T
- type: entity
  name: Swordfish Lever-Action Type-T
  parent: [WeaponLeverActionBase, BaseSecurityContraband]
  id: WeaponLeverActionNT
  description: A simple and reliable firearm, able to be easily manufacured by on-station Security Technology Fabricators. Despite being worse than standard automatic/semi-automatic firearms, it finds it's favorites regardless among Security Staff that prefer a more western look.
  components:
  - type: KnockbackByUserTag
    doestContain:
      Skating:
        knockback: 1.5
        staminaMultiplier: 50
      Resomi:
        knockback: 3.5
        staminaMultiplier: 15
      Avali:
        knockback: 1.5
        staminaMultiplier: 15
      Felionoid:
        knockback: 1.5
        staminaMultiplier: 15
      Animal:
        knockback: 3.5
        staminaMultiplier: 15
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_1989_NT/model_1989_x64x32.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_1989/model_1989_x32.rsi
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_1989/model_1989_x32.rsi
    size: Normal
    shape:
    - 0,0,4,0
    storedOffset: 0,-1
  - type: Gun # 3-8 Deviation (2x Scope / Short Barrel)
    fireRate: 1.5
    minAngle: 10
    maxAngle: 20
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: GunWieldBonus
    minAngle: -7
    maxAngle: -12
  - type: EyeCursorOffset
    maxOffset: 0
    pvsIncrease: 0
  - type: SpeedModifiedOnWield
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: UseDelay
    delay: 1.5
  - type: Scope
    canUseInsideContainer: true
    canUseNightVision: true
    zoomLevels:
      - name: 1x
        zoom: 1
        offset: 7
        doAfter: 0
        allowMovement: true
      - name: 2x
        zoom: 2
        offset: 7
        doAfter: 0
        allowMovement: true
  #type: Attachments (or smth)
  #- Stock/Barrel (- 10 Max / - 5 Min)
  #- Lightweight Stock (+0.5s Speed / + 0.5 Knockback)
  #- Short Barrel (-0.5s Wield Time / + 5 Max & 3 Min Deviation)
  #- Large Ammo Tube (12 RNDs)
  #- 2x Scope (2x Tile Range)
  #Modifiers:
  #- Lever Action (- 1 Knockback)

#region Model 2325
- type: entity
  name: Model 2325
  parent: [BaseItem, BaseSecurityContraband] #You have no idea how much of a pain in the ass this was.
  id: WeaponLeverActionModel2325
  description: As the name suggests, this is a very modern take on a Lever Action. It utilizes proprietary NanoTransen Hardlight Technology to dynamically modify it's internals, allowing for quick adjustment and adaptation of most common ammo calibers on the fly, as well as featuring an advanced stabilization system that negates recoil entirely. WARNING - Leaving ammunition inside while actively changing modes will destroy it!
  components:
  - type: AmmoCounter
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_2325/model_2325_x64x64.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_2325/model_2325_x64x64.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_2325/model_2325_x64x64.rsi
    size: Normal
    shape:
    - 0,0,4,0
  - type: StaticPrice
    price: 1000 #this thing is worth a lot
  #type: Attachments (or smth)
  #- Stock/Barrel (- 10 Max / - 5 Min)
  #- Hardlight Barrel/Reciver (Allows changing of Ammo Types)
  #- Hardlight Ammo Tube (Varies in capacity)
  #- Automatic Recoil Dampening System (Negates Recoil entirely)
  #- Smart Blue Dot Sights (1-5 Deviation / ~ 1.5x Tile Range [roughly])
  - type: ItemSwitch 
    onUse: false
    state: 44mag
    states:
      12g: !type:ItemSwitchState
        verb: 12 Gauge
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_2325/model_2325_x64x64.rsi #Sprites CANNOT be split into seperate folders, it doesn't support it.
          state: base
        components:
        - type: CursorOffsetRequiresWield
        - type: EyeCursorOffset #Scope does not work with this thing.
          maxOffset: 5
          pvsIncrease: 0.5
        - type: Wieldable
          unwieldOnUse: false
        - type: UseDelay
          delay: 2
        - type: SpeedModifiedOnWield
          walkModifier: 0.90
          sprintModifier: 0.90
        - type: AmmoCounter
        - type: GunWieldBonus
          minAngle: -9
          maxAngle: -15
        - type: Gun
          minAngle: 10
          maxAngle: 20
          pump: true
          fireRate: 1.5 # ~ 45 DPS, technically less depending on individual speed of racking
          selectedMode: SemiAuto
          availableModes:
          - SemiAuto
          soundGunshot:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1.ogg
            params:
              variation: 0.246
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - ShellShotgun
          capacity: 10
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

      44mag: !type:ItemSwitchState
        verb: .44 Magnum
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_2325/model_2325_x64x64.rsi #Sprites CANNOT be split into seperate folders, it doesn't support it.
          state: base
        components:
        - type: CursorOffsetRequiresWield
        - type: EyeCursorOffset #Scope does not work with this thing.
          maxOffset: 5
          pvsIncrease: 0.5
        - type: Wieldable
          unwieldOnUse: false
        - type: UseDelay
          delay: 2
        - type: SpeedModifiedOnWield
          walkModifier: 0.90
          sprintModifier: 0.90
        - type: AmmoCounter
        - type: GunWieldBonus
          minAngle: -9
          maxAngle: -15
        - type: Gun
          minAngle: 10
          maxAngle: 20
          pump: true
          fireRate: 1.5 # ~ 52.5 DPS, technically less depending on individual speed of racking
          selectedMode: SemiAuto
          availableModes:
          - SemiAuto
          soundGunshot:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1.ogg
            params:
              variation: 0.246
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - CartridgeMagnum
           - CartridgeMagnumImprovised
          capacity: 12
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

      38spec: !type:ItemSwitchState
        verb: .38 Special
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_2325/model_2325_x64x64.rsi
          state: base
        components:
        - type: CursorOffsetRequiresWield
        - type: EyeCursorOffset
          maxOffset: 5
          pvsIncrease: 0.5
        - type: Wieldable
          unwieldOnUse: false
        - type: UseDelay
          delay: 2
        - type: SpeedModifiedOnWield
          walkModifier: 0.90
          sprintModifier: 0.90
        - type: AmmoCounter
        - type: GunWieldBonus
          minAngle: -9
          maxAngle: -15
        - type: Gun
          minAngle: 10
          maxAngle: 20
          pump: true
          fireRate: 2 # ~ 50 DPS, technically less depending on individual speed of racking
          selectedMode: SemiAuto
          availableModes:
          - SemiAuto
          soundGunshot:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1.ogg
            params:
              variation: 0.246
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - CartridgeRevolver38
           - SpeedLoaderRevolver38
          capacity: 12
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

      rifle: !type:ItemSwitchState
        verb: 7.62 / 5.56
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Lever_Actions/Model_2325/model_2325_x64x64.rsi
          state: base
        components:

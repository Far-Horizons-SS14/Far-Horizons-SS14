          maxOffset: 5
          pvsIncrease: 0.5
        - type: Wieldable
          unwieldOnUse: false
        - type: UseDelay
          delay: 2
        - type: SpeedModifiedOnWield
          walkModifier: 0.90
          sprintModifier: 0.90
        - type: AmmoCounter
        - type: GunWieldBonus
          minAngle: -9
          maxAngle: -15
        - type: Gun
          minAngle: 10
          maxAngle: 20
          pump: true
          fireRate: 3.5 # ~ 56 DPS, same doubt of actually reaching that with pump.
          selectedMode: SemiAuto
          availableModes:
          - SemiAuto
          soundGunshot:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1.ogg
            params:
              variation: 0.246
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:

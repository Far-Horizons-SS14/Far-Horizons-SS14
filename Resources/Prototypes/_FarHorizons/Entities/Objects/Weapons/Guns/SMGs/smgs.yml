          priority: 2
          whitelist:
            tags:
              - MagazinePistolSubMachineGunSP
          whitelistFailPopup: gun-magazine-whitelist-fail
        gun_chamber:
          name: Chamber
          priority: 1
          whitelist:
            tags:
              - CartridgePistol

#region Marshal's Lever Action
- type: entity
  name: The Watcher
  parent: [BaseWeaponSniper, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponSniperWatcher
  description: A weapon designed to remind that The Law's eye is ever-watchful. Has a built-in shock-compensating stock, making the user barely feel the recoil of the gun. Chambers .44 magnum rounds.
  components:
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 0
      Felionoid:
        knockback: 0
      Avali:
        knockback: 0
      Animal:
        knockback: 0
  - type: BallisticAmmoProvider
    capacity: 10
    proto: CartridgeMagnumSP
    whitelist:
      tags:
        - CartridgeMagnum
    soundRack:
      path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
      params:
        variation: 0.05
  - type: Gun #Deviation when wielding is 0-10
    minAngle: 10
    maxAngle: 40
    soundGunshot:
      path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1.ogg
      params:
        variation: 0.246
    pump: true
    fireRate: 1.5
  - type: Sprite
    sprite: /Textures/_FarHorizons/Objects/Weapons/Guns/Snipers/mark1_rifle.rsi
  - type: Clothing
    sprite: /Textures/_FarHorizons/Objects/Weapons/Guns/Snipers/mark1_rifle.rsi
    slots:
      - Back
      - suitStorage
  - type: Item
    size: Large
  - type: Wieldable
    unwieldOnUse: false
  - type: Scope
    canUseInsideContainer: true
    canUseNightVision: true
    zoomLevels:
      - name: 1x
        zoom: 1
        offset: 7
        doAfter: 0
        allowMovement: true
      - name: 1.5x
        zoom: 1.5
        offset: 7
        doAfter: 0
        allowMovement: true
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -30
  - type: GunRequiresWield
  - type: StaticPrice
    price: 500
  - type: EyeCursorOffset # removing the "moving camera" when wielding the gun
    maxOffset: 0 #FH
    pvsIncrease: 0 #FH



- type: entity
  name: Swordfish Lever-Action
  parent: [BaseWeaponSniper]
  id: WeaponSniperLeverCivilian
  description: A Swordfish Lever-Action rifle. Accepts .30 and .44 Magnum cartridges.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Item
    size: Normal # Small, but can't fit in your pocket.
  - type: Gun
    fireRate: 1.0
    minAngle: 10
    maxAngle: 20
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: KnockbackByUserTag
    doestContain:
      Skating:
        knockback: 1.0
        staminaMultiplier: 100
      Resomi:
        knockback: 1.5
      Avali:
        knockback: 0.75 # half of what resomi take'
      Felionoid:
        knockback: 0.75 # half of what resomi take
      Animal: #FH
        knockback: 1.5 #FH
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMagnum
      - CartridgeMagnumImprovised
      - CartridgeLightRifle
      - CartridgeLightRifleImprovised
    capacity: 5
    proto: CartridgeMagnumSP
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.00
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -8
    maxAngle: -15

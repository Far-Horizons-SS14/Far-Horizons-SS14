#region =Neutral=





#region Citadel
- type: entity
  name: Citadel
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunCitadel
  description: An old faithful design refurbished for modern applications, and a personal favorite amongst many Corporate Security forces. Uses .50 Shotgun Shells.
  components:
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/Citadel/inhands_64x.rsi
  - type: Gun
    spread: 10
    pump: true
    fireRate: 2
  - type: BallisticAmmoProvider
    capacity: 6
    proto: ShellShotgun
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/Citadel/clothing.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/Citadel/clothing.rsi
  - type: GunRequiresWield
  - type: Tag
    tags:
    - ShotgunCitadel

#region Klauser
- type: entity
  name: Klauser
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunKlauser
  description: A highly advanced shotgun in the "Kammerer" series, typically employed in riot control. #It can quickly toggle between lethal and non-lethal rounds thanks to it's dual chamber. ##Pending rework to allow this
  components:
  - type: Item

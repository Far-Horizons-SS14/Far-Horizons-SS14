  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/Klauser/clothing.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/Klauser/clothing.rsi
  - type: GunRequiresWield
  - type: Tag
    tags:
    - ShotgunKlauser

#region FITZ-21
# Bit of an odd one, inherets from revolver to have instant speedloader reloads - a cheap way to include the shellholder on the sprite.
- type: entity
  name: FITZ-21
  parent: [BaseWeaponRevolver, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunFITZ21
  description: A semi automatic shotgun with a shellholder allowing for much faster reloads. Holds eight rounds.
  components:
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/FITZ21_Folded/inhands_64x.rsi
    size: Large
    shape:
    - 0,0,4,0
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
    spread: 20
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/FITZ21_Folded/clothing.rsi
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/FITZ21_Folded/clothing.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: GunRequiresWield
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - ShellShotgun
      - SpeedLoaderShotgun
    proto: ShellShotgun
    capacity: 8
    chambers: [ True, True, True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null, null, null ]
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 3
        staminaMultiplier: 20
      Avali:
        knockback: 1
        staminaMultiplier: 20
      Felionoid:
        knockback: 1.5
        staminaMultiplier: 20
      Animal:
        knockback: 3
        staminaMultiplier: 20
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - FITZ21

#region Sentinel
- type: entity
  name: Sentinel
  parent: [BaseWeaponShotgunAny, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponShotgunSentinel
  description: An odd magazine-fed pump action shotgun that is the result of a regulatory compromise. Fires as fast as you can pump it, loads .50 shotgun shells.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/Sentinel/clothing.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/Sentinel/inhands_x64.rsi
    size: Large
    shape:
    - 0,0,2,1
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/Sentinel/clothing.rsi
  - type: SpeedModifiedOnWield
    walkModifier: 1
    sprintModifier: 1
  - type: GunRequiresWield
  - type: UseDelay
    delay: 0.5
  - type: Gun
    spread: 22 #does nothing
    fireRate: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg #"/Audio/Weapons/Guns/Empty/empty.ogg" is the proper sound for it, but because of buggy guncode if you chamber the round too fast the game will think the gun is empty, but still fire properly, thus, playing this sound.
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineShotgun
        priority: 2
        whitelist:
          tags:
          - MagazineShotgun
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
      gun_chamber:
        name: Chamber
        startingItem: ShellShotgun
        priority: 1
        whitelist:
          tags:
          - ShellShotgun
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
    canRack: false
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: KnockbackByUserTag #pov, you want to fire the gun but are smol
    doestContain:
      Skating:
        knockback: 5.5
        staminaMultiplier: 50
      Resomi:
        knockback: 5
        staminaMultiplier: 20
      Avali:
        knockback: 3
        staminaMultiplier: 20
      Felionoid:
        knockback: 3.5
        staminaMultiplier: 20
      Animal:
        knockback: 5
        staminaMultiplier: 20
  - type: Tag
    tags:
    - ShotgunSentinel
  #type: Attachments (or smth)
  #- No Stock (-1 ADS / +1 Speed / +2 Spread / +2 Knockback)
  #- Short Barrel (-0.5 ADS / +0.5 Speed / +2 Spread) - Doesn't really apply since you can't go over 100% lmao
  #- Vertical Grip (+0.5 ADS / -2 Spread)


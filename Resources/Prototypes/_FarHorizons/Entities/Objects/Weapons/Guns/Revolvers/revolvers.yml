#region =Neutral=





#region Instigator
- type: entity
  name: Instigator
  parent: [BaseWeaponRevolver, BaseSecurityContraband]
  id: WeaponRevolverInstigator
  description: A simple and reliable double action .38 revolver provided to senior officers, following popular demand of more firepower in a standard security grade sidearm. Named as such due to owners of this firearm having a proclivity to instigate fights.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/instigator.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/instigator.rsi
  - type: Item
    storedOffset: 0,-2
  - type: RevolverAmmoProvider
    capacity: 8
    proto: CartridgeRevolver38SP
    chambers: [ True, True, True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null, null, null ]
    whitelist:
      tags:
        - CartridgeRevolver38
        - SpeedLoaderRevolver38
  - type: StealTarget
    stealGroup: OfficerHandgun

#region Instigator custom
- type: entity
  name: Instigator custom
  parent: [WeaponRevolverInstigator]
  id: WeaponRevolverInstigatorcustom
  description: A premium version of the Instigator, provided to officers that have dedicated a significant amount of time to upholding space law. Features an improved double-action trigger allowing for slightly faster firing.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/instigator_custom.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/instigator_custom.rsi
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 1.7
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: StealTarget
    stealGroup: OfficerHandgun

#region Inspector custom
- type: entity
  name: Inspector custom
  parent: [BaseWeaponRevolver, BaseSecurityContraband]
  id: WeaponRevolverInspectorcustom
  description: The premium version of the readily-avaliable Inspector, it is only handed out to veteran detectives worthy of such a handcannon. Features an improved double-action trigger allowing for slightly faster firing.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/inspector_custom.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/inspector_custom.rsi
  - type: Item
    storedOffset: 0,-2
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 1.7
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
  - type: StealTarget
    stealGroup: OfficerHandgun

#region Initiator
- type: entity
  name: Initiator
  parent: [BaseWeaponRevolver, BaseSecurityContraband]
  id: WeaponRevolverInitiator
  description: The snubnose version of the Inspector, typically used by civilians for a strong yet inaccurate easily concealable firearm. This one in particular appears to be specially fitted for Scurret hands.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/initiator.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/initiator.rsi
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    storedOffset: 0,-1
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 1.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
    minAngle: 20
    maxAngle: 30
  - type: RevolverAmmoProvider
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
  - type: StealTarget
    stealGroup: OfficerHandgun

#region =NanoTrasen=





#region Oath Breaker
- type: entity
  name: Oath Breaker
  parent: [BaseWeaponRevolver, BaseSecurityContraband]
  id: WeaponRevolverOathbreaker
  description: Originally commissioned by NanoTransen for station-side detectives, it was deemed too impractical and unwiedly for proper field use. It did, however, find it's niche among Brigmedics which greatly enjoyed utilizing it for brig defense. Comes with a longarm modifcation kit built in, but takes some time to assemble/deassemble.
  components:
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/oath_breaker.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/oath_breaker.rsi
    quickEquip: false
  - type: Tag
    tags:
    - Sidearm
    - OathBreaker
  - type: Gun
    spread: 25
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/oath_breaker.rsi
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - ShellShotgun
      - SpeedLoaderShotgun
    proto: null
    capacity: 3
    chambers: [ null, null, null ]
    ammoSlots: [ null, null, null ]
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 3
        staminaMultiplier: 20
      Avali:
        knockback: 1
        staminaMultiplier: 20
      Felionoid:
        knockback: 1.5
        staminaMultiplier: 20
      Animal:
        knockback: 3
        staminaMultiplier: 20
  - type: Construction
    graph: WeaponRevolverOathbreakerGraph
    node: attachment
  - type: StealTarget
    stealGroup: OfficerHandgun

#Longarm variant
- type: entity
  name: Extended Oath Breaker
  parent: [WeaponRevolverOathbreaker, BaseGunWieldable]
  id: WeaponRevolverOathbreakerExtended
  description: It seems to be fitted with a pistol stock, green dot sights, your combat knife and a muzzle brake. The cylinder also appears to have been swapped out for a sealed 4-shooter model.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/Stock_Oath_Breaker/sprite_64x32.rsi
  - type: Clothing
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/Stock_Oath_Breaker/clothing.rsi
    quickEquip: false
  - type: Item
    sprite: _FarHorizons/Objects/Weapons/Guns/Revolvers/Stock_Oath_Breaker/inhands.rsi
    size: Normal
    shape:
    - 0,0,3,0
    - 0,1,0,1
    storedOffset: 0,-4
  - type: GunRequiresWield
  - type: UseDelay
    delay: 0.5
  - type: Gun
    spread: 25 #does nothing
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - ShellShotgun
      - SpeedLoaderShotgun
    proto: null
    capacity: 4
    chambers: [ null, null, null, null  ]
    ammoSlots: [ null, null, null, null ]
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
  - type: Scope
    canUseInsideContainer: true
    canUseNightVision: true
    zoomLevels:
      - name: 1x
        zoom: 1
        offset: 7
        doAfter: 0
        allowMovement: true
      - name: 1.2x
        zoom: 1.2
        offset: 0
        doAfter: 0
        allowMovement: true
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 0
        staminaMultiplier: 0
      Avali:
        knockback: 0
        staminaMultiplier: 0
      Felionoid:
        knockback: 0
        staminaMultiplier: 0
      Animal:
        knockback: 0
        staminaMultiplier: 0
  - type: Sharp
  - type: MeleeWeapon
    wideAnimationRotation: -90
    attackRate: 1.5
    damage:
      types:
        Slash: 12 # Same as combat knife.
    soundHit: /Audio/Weapons/bladeslice.ogg
    angle: 0
    animation: WeaponArcThrust
  - type: AltFireMelee
    attackType: Heavy
  #type: Attachments (or smth)
  #- Green Dot Sights (+1 tile range / -0.5s ADS)
  #- Pistol Stock (Nullifies Species Knockback / +1s ADS / +Size Increase)
  #- Extended Cylnder (+1 Shell Count), im justifying this by pointing out this is in all intents and purposes a longarm that also needs to be wielded, doesn't fit in pocket/holster anymore.
  #- Muzzle Brake (this would increase accuracy if it MATTERED)
  - type: Construction
    graph: WeaponRevolverOathbreakerExtendedGraph
    node: attachment
  - type: StealTarget
    stealGroup: OfficerHandgun


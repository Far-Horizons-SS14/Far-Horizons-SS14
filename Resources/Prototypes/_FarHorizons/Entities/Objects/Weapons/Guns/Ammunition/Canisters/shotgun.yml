- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineCanisterShotgun12G
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - ShellShotgun
    proto: ShellShotgun
    capacity: 128 # 16x speedloader size 
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Canisters/shell_canister.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: b12g
  - type: MagazineVisuals
    magState: mag
    steps: 15
    zeroVisible: false
  - type: Appearance
  - type: Tag
    tags:
      - AmmoBoxShotgun12g

# Boxes
- type: entity
  parent: BaseMagazineCanisterShotgun12G
  id: MagazineCanisterShotgun12G
  name: 12 Gauge Ammunition Canister (Shotgun Any)
  description: A heavy duty metal canister of 12 Gauge rounds.
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: mag-tip-1
      map: [ "enum.GunVisualLayers.Tip" ]
    - state: b12g


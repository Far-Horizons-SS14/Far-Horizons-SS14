- type: entity
  id: SpeedLoaderShotgunFlare
  name: 12 Gauge Flare Speedloader
  parent: [ BaseSpeedLoaderShotgun, BaseSecurityContraband ]
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunFlare
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Shotgun/12g_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-8
        map: [ "enum.GunVisualLayers.Mag" ]
      - state: base-tip-8
        map: [ "enum.GunVisualLayers.Tip" ]
        color: "#ED7942"


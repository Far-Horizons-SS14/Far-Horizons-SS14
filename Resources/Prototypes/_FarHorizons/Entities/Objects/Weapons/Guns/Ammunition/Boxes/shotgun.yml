- type: entity
  id: BaseAmmoProvider
  parent: BaseItem
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi

- type: entity
  abstract: true
  parent: BaseAmmoProvider
  id: AmmoProviderShotgunShell
  description: 32-shell box of 12 Gauge Shotgun ammunition.
  components:
    - type: Sprite
      sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Boxes/Shotgun/12g.rsi
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
        - ShellShotgun
      capacity: 32 #4x mag size
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: false
    - type: Appearance
    - type: Tag
      tags:
      - ShotgunBoxAmmo
      - AmmoBoxShotgun12g

#Boxes
- type: entity
  id: BoxLethalshot
  parent: AmmoProviderShotgunShell
  name: Box of 12 Gauge Buckshot
  description: 32-shell box of 12 Gauge Buckshot. Good for unarmored targets.
  components:
    - type: BallisticAmmoProvider
      proto: ShellShotgun
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        color: "#F4001F"
        map: ["enum.GunVisualLayers.Mag"]
      - state: mag-tip-1
        map: [ "enum.GunVisualLayers.Tip" ]
      - state: hp


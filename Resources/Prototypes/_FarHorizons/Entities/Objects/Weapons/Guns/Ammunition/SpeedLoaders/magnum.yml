- type: entity
  id: BaseSpeedLoaderLeverCivilian
  name: Civilian Speed Loader (.30/.44 Magnum)
  parent: [BaseSpeedLoaderShotgun]
  description: A rifle speedloader designed to be paired with the Swordfish Lever-Action rifle. Accepts .30 and .44 Magnum cartridges.
  components:
  - type: BallisticAmmoProvider
    proto: null
    whitelist:
      tags:
        - CartridgeMagnum
        - CartridgeMagnumImprovised
        - CartridgeLightRifle
        - CartridgeLightRifleImprovised
    capacity: 5
  - type: MagazineVisuals
    magState: base
    steps: 6
    zeroVisible: false
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/improvised_lever_action_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-8
        map: [ "enum.GunVisualLayers.Mag" ]
      - state: base-tip-8
        map: [ "enum.GunVisualLayers.Tip" ]
        color: "#717171"

- type: entity
  id: SpeedLoaderLeverCivilianMagnumSP
  parent: BaseSpeedLoaderLeverCivilian
  name: Civilian Speed Loader (.44 Magnum SP)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumSP

- type: entity
  id: SpeedLoaderLeverCivilianMagnumRubber
  parent: BaseSpeedLoaderLeverCivilian
  name: Civilian Speed Loader (.44 Magnum Rubber)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumRubber
#region 7.92 Speedloader
- type: entity
  id: BaseSpeedLoaderRifle792
  parent: [ BaseItem, BaseSecurityContraband ]
  abstract: true
  name: "7.92 Speed Loader (Rifle)"
  description: 5-round 7.92 speed loader, designed for low capacity rifles. Also doubles as a magazine in compatible rifles.
  components:
  - type: Item
    size: Tiny
    storedOffset: 0,-1
  - type: Tag
    tags:
      - SpeedLoaderRifle792
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeRifle792
    capacity: 5
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Bolt_Action/stripper_clip.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: mag-5
        map: [ "enum.GunVisualLayers.Mag" ]
      - state: mag-tip-5
        map: [ "enum.GunVisualLayers.Tip" ]
        color: "#C7B458"
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

- type: entity
  id: SpeedLoaderRifle792
  name: "7.92 Speed Loader (Rifle Any)"
  parent: BaseSpeedLoaderRifle792
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: mag-5
        map: [ "enum.GunVisualLayers.Mag" ]


#region PPSh-59
- type: entity
  parent: BaseMagazinePistolSubMachineGun
  id: BaseMagazinePistolSubMachineGunPPSH
  name: PPSH Drum Magazine
  abstract: true
  description: Large 71-Round Drum magazine designed for the PPSh-59.
  components:
  - type: BallisticAmmoProvider
    proto: null
    capacity: 71
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Magazine/SMG/ppsh.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: MagazineVisuals
    magState: mag
    steps: 2
  - type: Tag
    tags:
      - MagazineSMGPPSH


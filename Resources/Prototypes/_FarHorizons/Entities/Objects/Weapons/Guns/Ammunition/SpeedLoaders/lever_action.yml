#region .44 Magnum
- type: entity
  id: SpeedLoaderMagnumLeverEmpty
  name: ".44 Magnum Speed Loader (Lever-Action)"
  parent: [BaseSpeedLoaderShotgun, BaseSecurityContraband]
  description: Spring-loaded tube designed to reload Lever Actions.
  components:
  - type: BallisticAmmoProvider
    proto: null
    whitelist:
      tags:
        - CartridgeMagnum
    capacity: 12
  - type: MagazineVisuals
    magState: mag
    steps: 13
    zeroVisible: false
  - type: Item
    size: Normal
    shape:
    - 0,0,0,1
    storedRotation: 90
    storedOffset: -1,0
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Lever_Action/lever_action_speed_loader.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    

#region Multipurpose Hardlight
- type: entity
  id: SpeedLoaderMagnumLeverEmptyHardlight
  name: "Hardlight Speedloader (Hardlight Lever-Action / Revolver)"
  parent: [BaseSpeedLoaderShotgun, BaseSecurityContraband]
  description: Specially designed, and technologically complicated speedloader for Hardlight weapons. Due to the sheer difference in capabilites, it is not compatible with normal weapons.
  components:
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Item
    size: Normal
    shape:
    - 0,0,0,1
    storedRotation: 90
    storedOffset: -1,0
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Lever_Action/multipurpose_speed_loader_hardlight.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: ItemSwitch 
    onUse: false
    state: 44mag
    states:
      12g: !type:ItemSwitchState
        verb: 12 Gauge
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Lever_Action/multipurpose_speed_loader_hardlight.rsi #Sprites CANNOT be split into seperate folders, it doesn't support it.
          state: base
        components:
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          mayTransfer: true
          fillDelay: 0.1
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - ShellShotgun
           - SpeedLoaderShotgun
          capacity: 10
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

      44mag: !type:ItemSwitchState
        verb: .44 Magnum
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Lever_Action/multipurpose_speed_loader_hardlight.rsi
          state: base
        components:
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          mayTransfer: true
          fillDelay: 0.1
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - CartridgeMagnum
           - CartridgeMagnumImprovised
          capacity: 12
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

      38spec: !type:ItemSwitchState
        verb: .38 Special
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Lever_Action/multipurpose_speed_loader_hardlight.rsi
          state: base
        components:
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          mayTransfer: true
          fillDelay: 0.1
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - CartridgeRevolver38
           - SpeedLoaderRevolver38
          capacity: 12
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

      rifle: !type:ItemSwitchState
        verb: 7.62 / 5.56
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Lever_Action/multipurpose_speed_loader_hardlight.rsi
          state: base
        components:
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          mayTransfer: true
          fillDelay: 0.1
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - CartridgeLightRifle
           - CartridgeLightRifleImprovised
           - CartridgeRifle556
          capacity: 35
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg

      9mm: !type:ItemSwitchState
        verb: 9mm
        sprite:
          sprite: _FarHorizons/Objects/Weapons/Guns/Ammunition/Speedloaders/Lever_Action/multipurpose_speed_loader_hardlight.rsi
          state: base
        components:
        - type: ContainerContainer
          containers:
           ballistic-ammo: !type:Container
             ents: []
        - type: BallisticAmmoProvider
          mayTransfer: true
          fillDelay: 0.1
          soundRack:
            path: /Audio/_FarHorizons/Items/Weapons/Mark1/mark1_cycle_Bolt.ogg
            params:
              variation: 0.05
          whitelist:
           tags:
           - CartridgePistol
          capacity: 50
          proto: null
          soundInsert:
            path: /Audio/Weapons/Guns/MagIn/shotgun_insert.ogg
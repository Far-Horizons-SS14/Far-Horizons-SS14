
- type: entity
  name: Security Shell Gun
  suffix: NT
  parent: [WeaponFlareGun, BaseSecurityContraband]
  id: WeaponFlareGunSecurity
  description: A modified flare gun originally designed to be used by security to launch non-lethal shotgun shells, however it can also fire lethal shells without risk.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/flaregun_security_nt.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Small
    sprite: _FarHorizons/Objects/Weapons/Guns/Shotguns/flaregun_security_nt.rsi
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - ShellShotgun
  - type: Tag
    tags:
    - Sidearm
    - SurvivalKitItems


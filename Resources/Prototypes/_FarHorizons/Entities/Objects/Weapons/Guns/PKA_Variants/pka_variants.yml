- type: entity
  name: Proto-Kinetic Shotgun
  id: WeaponProtoKineticShotgun
  parent: [WeaponProtoKineticAcceleratorBase, BaseSalvageMiningContraband]
  description: A modified variant of the Proto-Kinetic Accelerator, its bolt is fractured upon firing, resulting in a much more effective tool for mining and a potent weapon at close range.
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Weapons/Guns/PKA_Variants/kinetic_accelerator_shotgun.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: ProtoKineticPellet
    capacity: 1
    count: 1
  - type: RandomSprite
    available:
      - 0:
          icon: ""
          icon_h: ""
          icon_u: ""
    heldPrefixes:
      icon_h: "h"
      icon_u: "u"
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: GunRequiresWield
  - type: UpgradeableGun
    whitelist:
      tags:
      - PKSUpgrade
  - type: ContainerContainer
    containers:
      upgrades: !type:Container

- type: entity
  parent: BaseItem
  id: BorgWeaponPKA
  name: Cyborg Proto-Kinetic Accelerator
  description: An adaptation of the famous PKA for use by cyborgs.
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
      layers:
      - state: icon
      - state: animation-icon
        visible: false
        map: [ "empty-icon" ]
    - type: RandomSprite
      available:
        - 0:
            icon: ""
            icon_h: ""
            icon_u: ""
      heldPrefixes:
        icon_h: "h"
        icon_u: "u"
    # todo: add itemcomponent with inhandVisuals states using unused texture and animation assets in kinetic_accelerator.rsi
    # todo: add clothingcomponent with clothingVisuals states using unused texture and animations assets in kinetic_accelerator.rsi
    - type: Item
      sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    - type: Gun
      fireRate: 0.5
      selectedMode: SemiAuto
      angleDecay: 45
      minAngle: 1
      maxAngle: 2
      availableModes:
      - SemiAuto
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
      projectileSpeed: 25
    - type: AmmoCounter
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.AmmoVisuals.HasAmmo:
          empty-icon:
            True: { visible: False }
            False: { visible: True }
          #todo: add other 'empty' animations
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 0.75
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
    - type: BasicEntityAmmoProvider
      proto: BulletKinetic
      capacity: 1
      count: 1
    - type: Clothing
      sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
      quickEquip: false
      slots:
      - suitStorage
      - Belt
    - type: UseDelay
      delay: 1
    - type: UpgradeableGun
      whitelist:
        tags:
        - PKAUpgrade
    - type: ContainerContainer
      containers:
        upgrades: !type:Container
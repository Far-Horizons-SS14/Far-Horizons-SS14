#region NT jobs

- type: entity
  id: PlushieLizardJobHeadofsecurity
  name: Head of Security Lizard Plushie
  suffix: NT
  description: An adorable stuffed toy that resembles a lizardperson as the head of security. It seems to have been ripped and re-stitched a few times.
  components:
  - type: Sprite
    sprite: /Textures/_FarHorizons/Objects/Fun/Plushies/plushielizard_fh_jobs.rsi
    state: headofsecurity

- type: entity
  id: PlushieLizardJobSecuritycadet
  name: Security Cadet Lizard Plushie
  suffix: NT
  description: An adorable stuffed toy that resembles a lizardperson as a security cadet. Seems to have shock marks across the plushie.
  components:
  - type: Sprite
    sprite: /Textures/_FarHorizons/Objects/Fun/Plushies/plushielizard_fh_jobs.rsi
    state: securitycadet

- type: entity
  id: PlushieLizardJobSecurityofficer
  name: Security Officer Lizard Plushie
  suffix: NT
  description: An adorable stuffed toy that resembles a lizardperson as a security officer. The stuffing has been padded down from a lot of punching.
  components:
  - type: Sprite
    sprite: /Textures/_FarHorizons/Objects/Fun/Plushies/plushielizard_fh_jobs.rsi
    state: securityofficer

- type: entity
  id: PlushieLizardJobWarden
  name: Warden Lizard Plushie
  suffix: NT
  description: An adorable stuffed toy that resembles a lizardperson as a warden. Smells like black powder and gun oil.
  components:
  - type: Sprite
    sprite: /Textures/_FarHorizons/Objects/Fun/Plushies/plushielizard_fh_jobs.rsi
    state: warden


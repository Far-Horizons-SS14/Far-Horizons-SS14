- type: entity
  name: syndicate security radio
  description: A handy security radio.
  parent: RadioHandheldSecurity
  id: RadioHandheldSecuritySyndie
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Devices/securityradio.rsi
    layers:
    - state: syndicate
    - state: syndicate-on
      map: ['screen-layer']
      visible: false

- type: entity
  name: mercenary security radio
  description: A handy security radio.
  parent: RadioHandheldSecurity
  id: RadioHandheldMerc
  components:
  - type: Sprite
    sprite: _FarHorizons/Objects/Devices/securityradio.rsi
    layers:
    - state: mercenary
    - state: mercenary-on
      map: ['screen-layer']
      visible: false

- type: entity
  name: Security Radio
  suffix: NS
  description: A handy security radio.
  parent: [BaseItem, BaseSecurityContraband]
  id: RadioHandheldSecurityNS
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: SyndiSec
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - Security
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: _FarHorizons/Objects/Devices/securityradio.rsi
    layers:
    - state: syndicate
    - state: syndicate-on
      map: ['screen-layer']
      visible: false
  - type: Item
    sprite: Objects/Devices/securityhandy.rsi
    heldPrefix: walkietalkie
  - type: Tag
    tags:
    - Radio
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RadioDeviceVisuals.Broadcasting:
        screen-layer:
          True: { visible: true }
          False: { visible: false }
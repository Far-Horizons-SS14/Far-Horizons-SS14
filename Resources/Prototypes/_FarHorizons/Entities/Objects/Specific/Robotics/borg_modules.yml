    passiveType: Armor
  - type: ArmorBorgModule
    damageModifierSet: BorgArmorBase

- type: entity
  id: BorgModuleArmorSecBorg
  parent: [ BasePassiveBorgModule ]
  name: Security Cyborg Armor Module
  description: A passive module that control the cyborg's armor.
  components:
  - type: PassiveBorgModule
    passiveType: Armor
  - type: ArmorBorgModule
    damageModifierSet: BorgSecBorgArmor
  - type: ComponentBorgModule
    components:
    - type: BodySpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.95

- type: entity
  id: BorgModuleArmorReflective
  parent: [ BasePassiveBorgModule ]
  name: Reflective Armor Module
  description: A passive module that control the cyborg's armor.
  components:
  - type: PassiveBorgModule
    passiveType: Armor
  - type: ArmorBorgModule
    damageModifierSet: BorgArmorReflective
  - type: ComponentBorgModule
    components:
    - type: Reflect
      reflectProb: 1
      reflects:
        - Energy
    - type: BodySpeedModifier

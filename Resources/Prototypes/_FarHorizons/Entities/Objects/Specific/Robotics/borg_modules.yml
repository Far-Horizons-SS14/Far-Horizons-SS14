#region Passive Borg Modules
- type: entity
  id: BasePassiveBorgModule
  parent: [ BaseBorgModule ]
  name: Pasive Borg Module
  abstract: true
  description: A passive module that control the cyborg's access.
  components:
    - type: Sprite
      layers:
      - state: generic
      - state: icon-template
    - type: PassiveBorgModule
    - type: Tag
      tags:
      - BorgModuleGeneric
      - BorgModuleIPCIncompatible 


#region Access Modules
- type: entity
  id: BorgModuleAccessBase
  parent: [ BasePassiveBorgModule ]
  name: Access Module
  description: A passive module that control the cyborg's access.
  components:
  - type: PassiveBorgModule
    passiveType: Access
  - type: Tag
    tags:
    - BorgModuleGeneric
    - BorgModuleIPCIncompatible 
    - BorgModuleAccess
  - type: DoorElectronics
    accessGroups:
    - AllAccess
    - AllAccessNS
  - type: ActivatableUI
    key: enum.DoorElectronicsConfigurationUiKey.Key
    requiredItems:
      tags:
      - DoorElectronicsConfigurator
  - type: UserInterface
    interfaces:
      enum.DoorElectronicsConfigurationUiKey.Key:
        type: DoorElectronicsBoundUserInterface
  - type: Access
    enabled: false
  - type: AccessReader
  - type: IdCard
    canRenameObject: false
    allowDepartmentChange: false



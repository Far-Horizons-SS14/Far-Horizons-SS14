#region Speed Modules

- type: entity
  id: BorgModuleSpeedBasic
  parent: [ BasePassiveBorgModule ]
  name: Speed Module
  description: A passive module that control the cyborg's speed.
  components:
  - type: PassiveBorgModule
    passiveType: Speed
  - type: ComponentBorgModule
    components:
    - type: MovementSpeedModifier
      baseWalkSpeed : 2.5
      baseSprintSpeed : 4.5
    uninstallComponents:
    - type: MovementSpeedModifier
      baseWalkSpeed : 1.0
      baseSprintSpeed : 2.0

- type: entity
  id: BorgModuleSpeedAdvanced
  parent: [ BasePassiveBorgModule ]
  name: Advanced Speed Module
  description: A passive module that control the cyborg's speed.
  components:
  - type: PassiveBorgModule
    passiveType: Speed
  - type: ComponentBorgModule
    components:
    - type: MovementSpeedModifier
      baseWalkSpeed : 3
      baseSprintSpeed : 5.4
    uninstallComponents: 
    - type: MovementSpeedModifier
      baseWalkSpeed : 1.0
      baseSprintSpeed : 2.0
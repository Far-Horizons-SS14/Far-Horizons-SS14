#Cannot inheret from normal proto due to needing specific comps removed.

- type: entity
  name: Reinforced Jug
  parent: [ BaseItem, SolutionBeaker ]
  id: JugReinforced
  description: Used to contain a very large amount of chemicals or solutions. Chugging is extremely ill-advised, now explosion AND spill proof!
  components:
    - type: TESTSolutionSizeNonStandard
      reason: Reinforced jugs are specifically an upgrade over the standard jugs
    - type: Solution
      id: beaker
      solution:
        maxVol: 360
    - type: Sprite
      sprite: _FarHorizons/Objects/Specific/Chemistry/reinforced_jug.rsi
      layers:
        - state: jug
        - state: jug1
          map: [ "enum.SolutionContainerLayers.Fill" ]
          visible: false
    - type: Item
      size: Normal
      sprite: _FarHorizons/Objects/Specific/Chemistry/reinforced_jug.rsi
    - type: MixableSolution
      solution: beaker
    - type: RefillableSolution
      solution: beaker
    - type: DrainableSolution
      solution: beaker
    - type: ExaminableSolution
      solution: beaker
    - type: DrawableSolution
      solution: beaker
    - type: InjectableSolution
      solution: beaker
    - type: SolutionTransfer
      canChangeTransferAmount: true
    - type: SolutionItemStatus
      solution: beaker
    - type: UserInterface
      interfaces:
        enum.TransferAmountUiKey.Key:
          type: TransferAmountBoundUserInterface
    - type: Appearance
    - type: SolutionContainerVisuals
      maxFillLevels: 6
      fillBaseName: jug
      inHandsMaxFillLevels: 5
      inHandsFillBaseName: -fill-
    - type: StaticPrice
      price: 60
    - type: Label
    - type: Tag
      tags:
      - ChemDispensable
      - ChemBag
    - type: DnaSubstanceTrace

- type: entity
  name: Jerrycan
  parent: [SolutionBeaker, BaseItem]
  id: JerrycanBase
  description: Used to contain various types of gases for vehicles and generators. Reinforced with plasteel to prevent explosion-related industrial accidents.
  abstract: true
  components:
    - type: Sprite
      sprite: _FarHorizons/Objects/Specific/Vehicle/jerrycan.rsi
    - type: Item
      sprite: _FarHorizons/Objects/Specific/Vehicle/jerrycan.rsi
    - type: MixableSolution
      solution: beaker
    - type: RefillableSolution
      solution: beaker
    - type: DrainableSolution
      solution: beaker
    - type: ExaminableSolution
      solution: beaker
    - type: DrawableSolution
      solution: beaker
    - type: InjectableSolution
      solution: beaker
    - type: SolutionTransfer
      canChangeTransferAmount: true
    - type: SolutionItemStatus
      solution: beaker
    - type: UserInterface
      interfaces:
        enum.TransferAmountUiKey.Key:
          type: TransferAmountBoundUserInterface
    - type: Appearance
    - type: StaticPrice
      price: 60
    - type: Label
    - type: DnaSubstanceTrace
    - type: TESTSolutionSizeNonStandard
      reason: It seems like the jerry cans are generally twice as solution-dense as normal containers

- type: entity
  name: Gasoline Canister
  parent: [SolutionNormal, JerrycanBase]
  id: JerrycanGasolineSmall
  components:
    - type: Sprite
      layers:
        - state: gasoline_small-jerrycan
    - type: Item
      size: Small
      shape:
      - 0,0,1,0
      storedOffset: 0, 1
      heldPrefix: gasoline_small
    - type: Appearance

- type: entity
  parent: JerrycanGasolineSmall
  id: JerrycanGasolineSmallFilled
  suffix: Filled
  components:
    - type: Solution
      solution:
        reagents:
        - ReagentId: WeldingFuel #Replace with Gasoline if we ever want to stop using welding fuel for everything.
          Quantity: 120

- type: entity

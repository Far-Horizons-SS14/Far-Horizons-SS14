- type: entity
  name: Prints
  id: FluidFootprintContainer
  description: Prints from nearby liquid puddle
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: FloorTiles
  - type: Clickable
  - type: Transform
    noRot: true
    anchored: true
  - type: IgnoresFingerprints
  - type: FluidFootprintContainer
    cleanEffect: PuddleSparkle
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      cleanFixture:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        mask:
        - SlipLayer
        layer:
        - ItemMask
        hard: false
- type: entity
  parent: BaseSubstation
  id: SubstationShip
  suffix: Ship, 4.5MJ, Max Charge
  components:
  - type: Sprite # TODO: add sprite for maintenance panel open
    sprite: _FarHorizons/Structures/Power/substation.rsi
    snapCardinals: true
    layers:
    - state: substation_ship
    - state: screen_ship
      shader: unshaded
    - state: full
      shader: unshaded
  - type: Machine
    board: SubstationShipMachineCircuitboard
  - type: PowerMonitoringDevice
    sprite: _FarHorizons/Structures/Power/substation.rsi
    state: substation_ship_static
  - type: Battery
    maxCharge: 4500000
    startingCharge: 4500000
  - type: PowerNetworkBattery
    maxSupply: 150000
    maxChargeRate: 150000
    supplyRampTolerance: 10000
    supplyRampRate: 5000

- type: entity
  parent: SubstationShip
  id: SubstationShipEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0

- type: entity
  parent: BaseSubstationWall
  id: SubstationWallShip
  name: Wallmount Ship Substation
  suffix: Ship, 4MJ, Max Charge
  description: A Substation used in Ships.
  components:
  - type: Sprite # TODO: add sprite for maintenance panel open
    drawdepth: WallMountedItems
    sprite: _FarHorizons/Structures/Power/substation.rsi
    layers:
    - state: substation_wall_ship
    - state: screen_wall_ship
      shader: unshaded
  - type: Battery
    maxCharge: 4000000
    startingCharge: 4000000
  - type: ContainerFill
    containers:
      board: [ WallmountSubstationElectronicsShip ]
      manipulator: [ MicroManipulatorStockPart ]
      powercell: [ PowerCellHigh ]
  - type: ContainerContainer
    containers:
      board: !type:Container
      manipulator: !type:Container
      powercell: !type:Container
  - type: PowerNetworkBattery
    maxSupply: 150000
    maxChargeRate: 150000
    supplyRampTolerance: 10000
    supplyRampRate: 5000

- type: entity
  parent: BaseSubstationWallFrame
  id: SubstationWallShipFrame
  categories: [ HideSpawnMenu ]
  name: Wallmount Ship Substation Frame
  description: A substation frame for construction.
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _FarHorizons/Structures/Power/substation.rsi
    layers:
    - state: substation_wall_ship
  - type: Construction
    graph: SubstationWallShip
    node: frame

- type: entity
  parent: SubstationWallShip
  id: SubstationWallShipEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0
  - type: Construction
    graph: SubstationWallShip
    node: substation


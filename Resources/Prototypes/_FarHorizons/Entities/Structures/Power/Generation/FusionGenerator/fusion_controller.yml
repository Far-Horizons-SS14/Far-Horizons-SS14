- type: entity
  id: FusionReactorController
  parent: [ BaseStructure, ConstructibleMachine ]
  name: Fusion Reactor Controller
  description: The control center for a fusion reactor.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/ame.rsi
    state: control
  - type: Appearance
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: FusionReactorController
  - type: FusionReactorPowerSupply
  - type: FusionReactorRequireValid
    magnet: 1
    torus: 8
    alone: false
  - type: Machine
    board: FusionReactorControllerMachineCircuitboard
  - type: WiresPanel
  - type: NodeContainer
    examinable: true
    nodes:
      reactor:
        !type:DirectionalNode
        nodeGroupID: FusionReactor
        nodeDirection: North
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
  - type: PowerSupplier
    supplyRampRate: 75000
    supplyRampTolerance: 5000
  - type: ActivatableUI
    key: enum.FusionReactorUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.FusionReactorUiKey.Key:
        type: FusionReactorControllerBoundUserInterface
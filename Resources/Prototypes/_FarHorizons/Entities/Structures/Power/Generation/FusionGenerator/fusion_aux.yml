- type: entity
  id: FusionReactorCoolantPumpInlet
  parent: [ BaseStructure, ConstructibleMachine ]
  name: Fusion Reactor Coolant Pump
  description: A port of the coolant system for the fusion reactor.
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/thermomachine.rsi
    layers:
      - state: freezerOn
  - type: Appearance
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: FusionReactorCoolantPump
  - type: FusionReactorPowerDraw
    draw: 200
    priority: 1
  - type: FusionReactorRequireValid
    magnet: 1
  - type: AtmosDevice
  - type: Machine
    board: FusionReactorCoolantPumpMachineCircuitboard
  - type: WiresPanel
  - type: NodeContainer
    examinable: true
    nodes:
      reactor:
        !type:DirectionalNode
        nodeGroupID: FusionReactor
        nodeDirection: North
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        volume: 1000
  - type: ActivatableUI
    key: enum.FusionReactorUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.FusionReactorUiKey.Key:
        type: FusionReactorCoolantPumpBoundUserInterface

- type: entity
  id: FusionReactorCoolantPumpOutlet
  parent: FusionReactorCoolantPumpInlet
  components:
  - type: Sprite
    layers:
      - state: heaterOn
  - type: FusionReactorCoolantPump
    isInlet: false

- type: entity
  id: FusionReactorBattery
  parent: [ BaseStructure, ConstructibleMachine ]
  name: Fusion Reactor Supercapacitor
  description: Stores the energy needed to operate the fusion reactor.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Power/smes.rsi
    layers:
      - state: smes
  - type: Appearance
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: FusionReactorBattery
  - type: FusionReactorRequireValid
  - type: Battery
    netsync: false
    startingCharge: 16000000
    maxCharge: 16000000
  - type: ExaminableBattery
  - type: Machine
    board: FusionReactorCapacitorMachineCircuitboard
  - type: WiresPanel
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableTerminalPortNode
        nodeGroupID: HVPower
      reactor:
        !type:DirectionalNode
        nodeGroupID: FusionReactor
        nodeDirection: North
  - type: BatteryCharger
    voltage: High
    node: input
  - type: PowerNetworkBattery
    maxSupply: 150000
    maxChargeRate: 5000
    supplyRampTolerance: 5000
    supplyRampRate: 1000
  - type: UserInterface
    interfaces:
      enum.FusionReactorUiKey.Key:
        type: FusionReactorCapacitorBoundUserInterface
  - type: ActivatableUI
    key: enum.FusionReactorUiKey.Key

- type: entity
  id: FusionReactorBatteryEmpty
  parent: FusionReactorBattery
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0

- type: entity
  id: FusionReactorMaser
  parent: [ BaseStructure, ConstructibleMachine ]
  name: Fusion Reactor MASER
  description: Heats the plasma within a fusion reactor using concentrated microwaves.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi
    layers:
    - state: emitter2
  - type: Appearance
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: FusionReactorMaser
    jar_slot:
      whitelist:
        components:
        - AmeFuelContainer
  - type: FusionReactorPowerDraw
    priority: 2
  - type: FusionReactorRequireValid
    torus: 1
  - type: ContainerContainer
    containers:
      jar_slot: !type:ContainerSlot {}
  - type: ItemSlots
  - type: Machine
    board: FusionReactorMaserMachineCircuitboard
  - type: WiresPanel
  - type: NodeContainer
    examinable: true
    nodes:
      reactor:
        !type:DirectionalNode
        nodeGroupID: FusionReactor
        nodeDirection: North
  - type: ActivatableUI
    key: enum.FusionReactorUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.FusionReactorUiKey.Key:
        type: FusionReactorMaserBoundUserInterface

- type: entity
  id: FusionReactorGasInlet
  parent: [ BaseStructure, ConstructibleMachine ]
  name: Fusion Reactor Gas Inlet
  description: Breaks down gases into atoms for use in the fusion reactor.
  components:
  - type: Sprite
    sprite: Structures/Machines/gasrecycler.rsi
    layers:
      - state: running
  - type: Appearance
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: FusionReactorGasInlet
  - type: FusionReactorPowerDraw
  - type: FusionReactorRequireValid
    alone: false
  - type: AtmosDevice
  - type: Machine
    board: FusionReactorGasInletMachineCircuitboard
  - type: WiresPanel
  - type: NodeContainer
    examinable: true
    nodes:
      reactor:
        !type:DirectionalNode
        nodeGroupID: FusionReactor
        nodeDirection: North
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        volume: 200
  - type: ActivatableUI
    key: enum.FusionReactorUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.FusionReactorUiKey.Key:
        type: FusionReactorGasInletBoundUserInterface
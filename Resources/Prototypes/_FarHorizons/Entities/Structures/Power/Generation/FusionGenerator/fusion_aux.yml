- type: entity
  id: FusionReactorCoolantPumpInlet
  parent: BaseStructure
  name: Fusion Reactor Coolant Pump
  description: A port of the coolant system for the fusion reactor.
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/thermomachine.rsi
    layers:
      - state: freezerOn
  - type: FusionReactorCoolantPump
  - type: AtmosDevice
  - type: NodeContainer
    examinable: true
    nodes:
      reactor:
        !type:AdjacentNode
        nodeGroupID: FusionReactor
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        volume: 1000

- type: entity
  id: FusionReactorCoolantPumpOutlet
  parent: FusionReactorCoolantPumpInlet
  components:
  - type: Sprite
    layers:
      - state: heaterOn
  - type: FusionReactorCoolantPump
    isInlet: false

- type: entity
  id: FusionReactorBattery
  parent: BaseStructure
  name: Fusion Reactor Supercapacitor
  description: Stores the energy needed to operate the fusion reactor.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Power/smes.rsi
    snapCardinals: true
    layers:
      - state: smes
  - type: FusionReactorBattery
  - type: Battery
    netsync: false
    startingCharge: 0
    maxCharge: 8000000
  - type: ExaminableBattery
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableTerminalPortNode
        nodeGroupID: HVPower
      reactor:
        !type:AdjacentNode
        nodeGroupID: FusionReactor
  - type: BatteryCharger
    voltage: High
    node: input
  - type: PowerNetworkBattery
    maxSupply: 150000
    maxChargeRate: 5000
    supplyRampTolerance: 5000
    supplyRampRate: 1000
  - type: BatteryInterface
    minChargeRate: 5000
    maxChargeRate: 150000
    minSupply: 5000
    maxSupply: 150000
  - type: UserInterface
    interfaces:
      enum.BatteryUiKey.Key:
        type: BatteryBoundUserInterface
  - type: ActivatableUI
    key: enum.BatteryUiKey.Key

- type: entity
  id: FusionReactorMaser
  parent: BaseStructure
  name: Fusion Reactor MASER
  description: Heats the plasma within a fusion reactor using concentrated microwaves.
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi
    layers:
    - state: emitter2
  - type: FusionReactorMaser
    jar_slot:
      whitelist:
        components:
        - AmeFuelContainer
  - type: ContainerContainer
    containers:
      jar_slot: !type:ContainerSlot {}
  - type: ItemSlots
  - type: AtmosDevice
  - type: NodeContainer
    examinable: true
    nodes:
      reactor:
        !type:AdjacentNode
        nodeGroupID: FusionReactor
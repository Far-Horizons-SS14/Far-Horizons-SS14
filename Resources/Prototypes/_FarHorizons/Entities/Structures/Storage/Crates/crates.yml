# Security lock boxes
- type: entity
  parent: CrateBaseLockBox
  id: CrateLockBoxSecurityNT
  name: security lock box
  suffix: NT, Secure
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#0060a5"
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: overlay-closed
      color: "#0060a5"
      map: [ lid_overlay ]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: paper
      sprite: Structures/Storage/Crates/labels.rsi
      offset: "-0.46875,0.03125"
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: OverrideSell
    overrideAccount: Security
  - type: AccessReader
    access: [["Security"], ["Cadet"]]

- type: entity
  parent: CrateBaseLockBox
  id: CrateLockBoxSecurityNS
  name: security lock box
  suffix: NS, Secure
  components:
  - type: Sprite

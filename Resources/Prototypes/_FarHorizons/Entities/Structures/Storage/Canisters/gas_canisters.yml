- type: entity
  parent: GasCanister
  id: LargeAirCanister
  name: Large Air Canister
  description: A double capacity canister that can contain any type of gas. This one is supposed to contain air mixture. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Storage/canister.rsi
    noRot: true
    layers:
      - state: grey
      - state: paper
        visible: false
        map: [ "enum.PaperLabelVisuals.Layer" ]
  - type: GasCanister
    air:
      volume: 3000
      moles:
        Oxygen: 1163.12 # oxygen 21%
        Nitrogen: 4375.58 # nitrogen 79%
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          AirCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior
- type: entity
  id: BaseAdSign
  parent: BaseBarSign
  name: ad sign
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Wallmounts/flatscreentv.rsi
    state: empty
  - type: BarSign
    emped: EmpedSign
    broken: BrokenSign
    titleName: adsign-ui-menu
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: LitOnPowered
  - type: Repairable
    doAfterDelay: 5
  - type: PointLight
    enabled: true
    energy: 2
    radius: 2.5
    offset: 0.0, -.75

#region Generics
- type: barSign
  id: EmpedSign
  name: barsign-prototype-name-emped-screen
  icon:
    sprite: _FarHorizons/Structures/Wallmounts/flatscreentv.rsi
    state: television_wall
  description: barsign-prototype-description-emped-screen
  hidden: true
  signType: AdSignGeneric
  color: "#002DB3"
        
- type: barSign
  id: BrokenSign
  name: barsign-prototype-name-broken-screen
  icon:
    sprite: _FarHorizons/Structures/Wallmounts/flatscreentv.rsi
    state: television_wallbroken
  description: barsign-prototype-description-broken-screen
  hidden: true
  signType: AdSignGeneric
  color: "#002DB3"


  #   - Borg
  # Starligh edit End

- type: entity
  parent: WeaponEnergyTurretStationControlPanelBaseNS
  id: WeaponEnergyTurretSecurityControlPanelNS
  suffix: NS, Security
  components:
  - type: AccessReader
    access: [["StationAiNS"], ["SecurityNS"]]
  - type: ContainerFill
    containers:
      board:
      - WeaponEnergyTurretSecurityControlPanelElectronicsNS
  - type: TurretTargetSettings
    exemptAccessLevels:
    - SecurityNS
    - BasicSiliconNS
    - BorgNS

- type: entity
  parent: WeaponEnergyTurretStationControlPanelBaseNS
  id: WeaponEnergyTurretCommandControlPanelNS
  suffix: NS, Command
  components:
  - type: AccessReader
    access: [["StationAiNS"], ["Executive"]]
  - type: ContainerFill
    containers:
      board:
      - WeaponEnergyTurretCommandControlPanelElectronicsNS
  - type: TurretTargetSettings
    exemptAccessLevels:
    - Executive
    - BasicSiliconNS
    - BorgNS

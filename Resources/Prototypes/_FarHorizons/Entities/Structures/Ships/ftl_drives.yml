- type: entity
  id: FTLDrive # Can move things like the security ship.
  parent: FTLDriveMini
  name: FTL Drive
  description: The miracle of the Space Age. Allows for Faster-Than-Light travel, at a hefty power cost. Has decent range and FTL mass tolerances.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Machines/Ship/ftl_drive_large.rsi
    offset: 0.5, 0.5
    layers:
    - state: large_ftl
      visible: true
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 50000
  - type: InteractionOutline
  - type: Rotatable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0,1.5,1.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - HighImpassable
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible

- type: entity
  id: FTLDriveMini #Weakest, only moves very small shuttles or pods.
  parent: BaseStructure
  name: Wall-Mounted FTL Drive
  description: The miracle of the Space Age. Allows for Faster-Than-Light travel, at a hefty power cost. Don't expect it to go far. Only moves pods.
  components:
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _FarHorizons/Structures/Machines/Ship/ftl_drive.rsi
    layers:
    - state: small_ftl
      visible: true
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: InteractionOutline
  - type: Rotatable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - HighImpassable
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: PowerState
    idlePowerDraw: 1000
    workingPowerDraw: 5000 #While charging up
  - type: Anchorable
    delay: 9
  

#region WallShuttleReinforced
- type: entity
  parent: BaseWall
  id: WallShuttleReinforced
  name: Reinforced Shuttle Wall
  suffix: NT
  components:
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 750
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 390
  - type: RadiationBlocker
    resistance: 7
  - type: Sprite
    sprite: _FarHorizons/Structures/Walls/NanoTrasen/reinf_shuttle.rsi
  - type: Icon
    sprite: _FarHorizons/Structures/Walls/NanoTrasen/reinf_shuttle.rsi
    state: full
  - type: IconSmooth
    key: walls
    base: state
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ShuttleWallVisuals.DeconstructionStage:
        ShuttleWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: shuttle_construct-0, visible: true}
          1: { state: shuttle_construct-1, visible: true}
          2: { state: shuttle_construct-2, visible: true}
          3: { state: shuttle_construct-3, visible: true}
          4: { state: shuttle_construct-4, visible: true}
          5: { state: shuttle_construct-5, visible: true}
  - type: Ricochetable
    chance: 1
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 3000
  - type: Construction
    graph: Girder
    node: ReinforcedShuttleWall

- type: entity
  parent: WallShuttleReinforced
  id: WallShuttleReinforcedGeneric
  suffix: Generic
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Walls/NanoTrasen/reinf_shuttle.rsi
  - type: Icon
    sprite: _FarHorizons/Structures/Walls/NanoTrasen/reinf_shuttle.rsi


- type: entity
  parent: WallDiagonalBase
  id: WallShuttleReinforcedDiagonal
  name: Reinforced Shuttle Wall
  suffix: Diagonal, NT
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _FarHorizons/Structures/Walls/NanoTrasen/shuttle_diagonal.rsi
    state: state0
  - type: Icon
    sprite: _FarHorizons/Structures/Walls/NanoTrasen/shuttle_diagonal.rsi
    state: state0
  - type: IconSmooth
    key: walls
    base: state
  - type: Physics
    bodyType: Static
  - type: Ricochetable
    chance: 1
  - type: Pullable
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 3000
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 750
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: RadiationBlocker
    resistance: 7
  - type: StaticPrice
    price: 300
  - type: Construction
    graph: Girder
    node: DiagonalReinforcedShuttleWall

- type: entity
  parent: WallShuttleReinforcedDiagonal
  id: WallShuttleReinforcedDiagonalGeneric

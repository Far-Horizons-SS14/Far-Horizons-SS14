- type: entity
  parent: ComputerRoboticsControl
  id: ComputerSecurityRoboticsControl
  name: Security Robotics Control Console
  description: A variant of the robotics control console, specifically meant to control security cyborgs.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Machines/Computers/secrobotics.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: computer 
    - map: ["computerLayerScreen"]
      state: robot-sec
    #- map: ["computerLayerKeys"] - Only the screen layer gets turned off, having this active with the merged screen/key png kept the screen on.
    #  state: robot-sec
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: RoboticsConsole
  - type: ActiveRadio
    channels:
    - Science
    - Security
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SecurityRoboticsConsole
    transmitFrequencyId: SecborgControl
  - type: Computer
    board: SecurityRoboticsConsoleCircuitboard
  - type: AccessReader
    access: [["Armory"]]

- type: entity
  parent: BaseStructureComputer
  id: BaseComputerAiAccessNoEdgeConnection
  name: Computer
  placement:
    mode: SnapgridCenter
  components:
  - type: Animateable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Construction
    graph: Computer
    node: computer
    containers:
      - board
  - type: Computer
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 500
  - type: UIPowerState
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ItemSlots
    slots:
      pai_slot:
        name: Personal AI Device
        whitelist:
          components:
          - PAI
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
      enum.EdgeConnectionVisuals.ConnectionMask:
        computerLayerBody:
          None: { state: computer, sprite: Structures/Machines/computers.rsi }
          West: { state: computer_r, sprite: _Starlight/Structures/Machines/computers.rsi }
          East: { state: computer_l, sprite: _Starlight/Structures/Machines/computers.rsi }
          East, West: { state: computer_l_r, sprite: _Starlight/Structures/Machines/computers.rsi }
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 3.0
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    offset: "0, 0.4"
    castShadows: false
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10
    blacklist:
      tags:
      - NoConsoleSound
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
      pai_slot: !type:ContainerSlot {} #FarHorizons
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresVisuals
  - type: StationAiWhitelist
  - type: Wires
    boardName: wires-board-name-computer
    layoutId: ComputerAi

- type: entity
  parent: BaseComputerAiAccessNoEdgeConnection
  id: VitalsMonitor
  name: Vitals Monitor
  description: A device that monitors the vitals of whoever is laying next to it.
  components:
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#1f8c28"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - TableMask
  - type: Sprite
    sprite: _FarHorizons/Structures/Machines/Computers/vitalmonitor.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerScreen"]
      state: screen
  - type: Speech
  - type: BodyScanner
  - type: HealthAnalyzer
    talk: true
  - type: ActivatableUI
    key: enum.HealthAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 2
    ports:
      - VitalsMonitorSender
  - type: Machine
    board: VitalsMonitorMachineCircuitboard
  - type: ContainerContainer
    containers:
      board: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
      pai_slot: !type:ContainerSlot {}


- type: entity
  parent: BaseComputerAiAccess
  id: CredstickATM
  name: ATM
  description: An ATM that can issue new credsticks.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: CredstickATM
    withdrawSound: /Audio/_Starlight/Misc/atm.ogg
    errorSound: /Audio/Machines/buzz-two.ogg
    credstickOffering:
      0:
        proto: CredstickEmpty
        cost: 5
      500:
        proto: CredstickDeluxeEmpty
        cost: 0
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _Starlight/Structures/Machines/atm.rsi
    layers:
    - map: ["computerLayerBody"]
      state: offline
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
  - type: ActivatableUI
    key: enum.CredstickATMUIKey.Key
  - type: UserInterface
    interfaces:
     enum.CredstickATMUIKey.Key:
        type: CredstickATMBui
  - type: PointLight
    enabled: true
    radius: 1.5
    energy: 1.6
    color: "#57A3F7"
  - type: Rotatable
    rotateWhileAnchored: false
- type: entity
  id: ReactorHolotable
  parent: HolotableBase
  name: Reactor Holotable
  suffix: NT
  description: Holographic display table. Used to monitor a nuclear reactor.
  components:
    - type: Sprite
      sprite: _FarHorizons/Structures/Machines/HoloTables/engineering_holotable.rsi
      layers:
      - state: Engineering-Table
        type: Icon
        sprite: _FarHorizons/Structures/Machines/HoloTables/engineering_holotable.rsi
      - map: [ "enum.PowerDeviceVisualLayers.Powered" ]
        state: Reactor-Holotable
        shader: unshaded
        type: Icon
        sprite: _FarHorizons/Structures/Machines/HoloTables/engineering_holotable.rsi
    - type: Appearance
    - type: PointLight
      radius: 3
      energy: 2
      color: "#d9b12e"
    - type: NuclearReactorMonitor
    - type: ActivatableUI
      key: enum.NuclearReactorUiKey.Key
    - type: UserInterface
      interfaces:
        enum.NuclearReactorUiKey.Key:
          type: NuclearReactorBoundUserInterface
    - type: AccessReader # You got a permit for that meltdown?
      access: [["Engineering"]]
    - type: Lock
      unlockOnClick: false
    - type: DeviceList
    - type: DeviceNetwork
      deviceNetId: Wireless
    - type: DeviceLinkSink
      ports:
        - NuclearReactorDataReceiver


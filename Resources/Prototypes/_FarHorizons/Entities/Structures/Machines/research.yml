- type: entity
  id: ResearchAndDevelopmentServerNS
  parent: ResearchAndDevelopmentServer
  suffix: NS
  components: 
  - type: FHResearchTree
    tree: ResearchTreeNT
    maxQueueSize: 3
    bankCapacity: 15000
    pointBleed: 1000 #When current amount of banked poins more than bankCapacity, this much is removed every second
    warningFrequency: 60
    announceTo:
      - SyndiSci
  - type: ActiveRadio
    channels:
    - SyndiSec
    - SyndiSci
    - SyndiService
    - GSL
    - SyndiMed
    - SyndiEngi
    sprite: Structures/Machines/circuit_imprinter_hypercon.rsi
  - type: Machine
    board: BoardEngraverSubzeroMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot


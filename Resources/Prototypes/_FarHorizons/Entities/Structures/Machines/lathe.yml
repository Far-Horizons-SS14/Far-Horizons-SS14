#region Nanotrasen
- type: entity
  id: SecurityTechFabAmmo
  parent: BaseLatheLube
  name: Security Ammo Techfab
  description: Prints NanoTrasen-Approved Ammo for use by Security Crew.
  suffix: NT
  components:
  - type: Sprite
    snapCardinals: true
    sprite: _FarHorizons/Structures/Machines/NT/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: secbullet
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: SecurityAmmoTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    unlitIdleState: unlit
    unlitRunningState: unlit # Far Horizons - replace with animations when available
    staticPacks:
    - FarHorizonsSecurityAmmoStatic
    - FarHorizonsCivilianMagazinesStatic
    dynamicPacks:
    - FarHorizonsSecurityAmmoDynamic
    - FarHorizonsSecurityThrowablesDynamic
  - type: EmagLatheRecipes
    emagStaticPacks:
    - StarlightSyndicateModulesSecfab
    - StarlightSyndicateAmmoStatic
    - FarHorizonsSecurityAmmoEmagStatic
    - FarHorizonsAmmoStatic
    emagDynamicPacks:
    - FarHorizonsSecurityAmmoEmagDynamic
    - FarHorizonsAmmoDynamic
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient

- type: entity
  id: BiochemicalLathe
  parent: BaseLatheLube
  name: Biochemical Lathe
  suffix: NT
  description: Converts biomass into complex biological parts.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Machines/NS/protofab.rsi #TODO: SPRITE
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: BiochemicalLatheMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - BiologicalOrgansNT
    # dynamicPacks:
    # - AdvancedTools
  # - type: EmagLatheRecipes
  #   emagDynamicPacks:
  #   -

#region NeoSol
- type: entity
  abstract: true
  id: BaseSubzerolathe
  components:
  - type: Lathe
    materialUseMultiplier: 0.4
    timeMultiplier: 2
  - type: LatheHeatProducing #TODO: Find balanced Value for Subzero 
    energyPerSecond: -40000
  - type: ReagentSpeed
    modifiers:
      SpaceLube: 0.8
      SpaceGlue: 5

- type: entity
  id: AutolatheSubzero
  parent: [Autolathe, BaseSubzerolathe]
  name: Subzero Autolathe
  suffix: NS
  description: A highly-experimental Autolathe that harnesses the power of extreme cold to slowly create objects more cost-effectively.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Machines/NS/autofab.rsi #TODO: CUSTOM SPRITE
  - type: Machine
    board: AutolatheSubzeroMachineCircuitboard

- type: entity
  id: Protofab
  parent: BaseLatheLube
  name: Protofab
  suffix: NS
  description: Converts raw materials into advanced items.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Machines/NS/protofab.rsi #TODO: CUSTOM SPRITE
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: ProtofabMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - ChemistryStatic
    dynamicPacks: #TODO: SYNDI TECH
    - AdvancedTools
    - ScienceEquipment
    - ScienceExplosives
    - ScienceClothing
    - PowerCells
    - ScienceWeapons
    - Mining
    - AtmosTools
    - EngineeringWeapons
    - Chemistry
    - Janitor
    - Instruments
    - Equipment
    - StarlightProtolatheLootable
  - type: EmagLatheRecipes
    emagDynamicPacks: #TODO: NT THEMED EMAG PACKS
    - StarlightSurgeryDynamic
    - StarlightCyberlimbDynamic
    - StarlightCyberOrgansDynamic
    - StarlightImplantDynamic
    - StarlightBudgetCyberOrgansDynamic
    - FarHorizonsAmmoDynamic
    - StarlightSecurityExplosives
    - StarlightSecurityEquipment
    - StarlightSecurityWeapons
    - StarlightDefenseStatic

- type: entity
  id: ProtofabSubzero
  parent: [Protofab, BaseSubzerolathe]
  name: Subzero Protofab
  description: A highly-experimental Protofab that harnesses the power of extreme cold to slowly create objects more cost-effectively.
  components:
  - type: Sprite
    sprite: _FarHorizons/Structures/Machines/NS/protofab.rsi #TODO: CUSTOM SPRITE
  - type: Machine
    board: ProtofabSubzeroMachineCircuitboard

- type: entity
  id: BoardEngraver
  parent: BaseLatheLube
  name: Board Engraver
  suffix: NS
  description: Prints circuit boards for machines.
  components:
  - type: Sprite
    sprite: Structures/Machines/circuit_imprinter.rsi #TODO: CUSTOM SPRITE
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: BoardEngraverMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/circuitprinter.ogg #TODO: CUSTOM SOUND
    idleState: icon
    runningState: building
    staticPacks:
    - NSScienceBoardsStatic
    - NSServiceBoardsStatic
    - CargoBoardsStatic #Should Syndi have this?
    - NSMedicalBoardsStatic 
    - NSEngineeringBoardsStatic 
    - NSStarlightVendorBoards
    dynamicPacks: #TODO: SYNDI TECH
    - NSEngineeringBoards
    - CargoBoards
    - NSMedicalBoards
    - NSServiceBoards
    - NSScienceBoards
    - NSCameraBoards
    - MechBoards
    - ShuttleBoards
    - StarlightMechBoards
    - StarlightLawboards
    - StarlightCircuitImprinterLootable
    - ReactorCircuitboards
  - type: EmagLatheRecipes
    emagDynamicPacks: #TODO: NT THEMED EMAG PACKS
    - StarlightSecurityBoards
    emagStaticPacks:
    - StarlightDangerousLawboards
    - StarlightSyndicateVendorBoards
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient
  - type: RequireProjectileTarget

- type: entity
  id: BoardEngraverSubzero
  parent: [BoardEngraver, BaseSubzerolathe]
  name: Subzero Board Engraver
  description: A highly-experimental Board Engraver that harnesses the power of extreme cold to slowly create objects more cost-effectively.
  components:

#region ## NanoTrasen ##





#region Security

- type: entity
  parent: [BaseSecurityContraband, ClothingOuterWinterCoatToggleable, AllowSuitStorageClothing]
  id: ClothingOuterCoatCorpsmanFH
  name: Corpsman's Armored Jacket
  suffix: NT
  description: Heavily armored yet surprisingly comfortable jacket, a byproduct from the tendency of corpsmen to throw themselves directly into danger.
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/Coats/corpsman.rsi
  - type: Clothing
    sprite: _FarHorizons/Clothing/OuterClothing/Coats/corpsman.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
  - type: Pierceable
    level: Metal
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.50
  - type: Armor
    modifiers:
      flatReductions:
        Piercing: 5
        Heat: 4
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.60
        Heat: 0.75
        Caustic: 0.75
  - type: LimbArmor
    limbs:
      ArmRight: {}
      ArmLeft: {}
      LegRight: {}
      LegLeft: {}
  - type: ExplosionResistance
    damageCoefficient: 0.95
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodCorpsman

- type: entity
  parent: [ClothingOuterWinterCoat, BaseSecurityContraband, AllowSuitStorageClothing]
  id: ClothingOuterWinterSecurityDeputy
  name: Deputy Winter Coat
  suffix: NT
  description: Adorned with two blue & golden strips on each shoulder. This Coat is given out as a reward to members of Security who have completed the Concord Frontier Authority training programme.
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/WinterCoats/deputy_coat.rsi
  - type: Clothing
    sprite: _FarHorizons/Clothing/OuterClothing/WinterCoats/deputy_coat.rsi
  - type: Armor
    modifiers:
      flatReductions:
        Piercing: 5
        Heat: 4
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70
        Heat: 0.80
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: ClothingOuterCoatAMG
  id: ClothingOuterWinterSecurityDeputyBrigmedic
  name: Deputy Brigmedic's Armored Winter Coat
  suffix: NT
  description: Adorned with two blue & golden strips on each shoulder. This Coat is given out as a reward to members of Security who have completed the Concord Frontier Authority training programme.
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/WinterCoats/deputy_brigmedic.rsi
  - type: Clothing
    sprite: _FarHorizons/Clothing/OuterClothing/WinterCoats/deputy_brigmedic.rsi
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.55
  - type: TemperatureProtection
    heatingCoefficient: 1.1
    coolingCoefficient: 0.1
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: ClothingOuterCoatCorpsmanFH

    hailSound:
      path: /Audio/Machines/custom_deny.ogg
      params:
        volume: -100 # shut
    cooldownDuration: 5
  - type: LimbArmor
    limbs:
      Head:
        flatReductions:
          Piercing: 5
          Heat: 4
        coefficients:
          Blunt: 0.2
          Slash: 0.2
          Piercing: 0.2
          Heat: 0.2
          Radiation: 0.2
          Caustic: 0.2


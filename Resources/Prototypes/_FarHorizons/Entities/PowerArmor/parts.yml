- type: entity
  id: PowerArmorPartBase
  name: Power Armor Part Base
  parent: BaseItem
  abstract: true
  components:
  - type: Item
    size: Normal
  - type: InteractionOutline
  - type: Clickable
  - type: Appearance
  - type: PowerArmorPart
    partType: Head
  - type: Damageable
    damageContainer: LimbDamageContainer
    

#region Base Parts
- type: entity
  id: PowerArmorHelmetBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.Head"]
      offset: 0, -0.25 
      state: equipped-head
  - type: PowerArmorPart
    partType: Head

- type: entity
  id: PowerArmorChestBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.Chest"]
      state: chest
  - type: PowerArmorPart
    partType: Chest

- type: entity
  id: PowerArmorLArmBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.LArm"]
      offset: 0.25, 0
      state: larm
  - type: PowerArmorPart

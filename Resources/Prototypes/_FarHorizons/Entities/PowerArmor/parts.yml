- type: entity
  id: PowerArmorRArmBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.RArm"]
      offset: -0.25, 0
      state: rarm
  - type: PowerArmorPart
    partType: RArm

- type: entity
  id: PowerArmorLLegBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.LLeg"]
      offset: 0.125, 0.25
      state: lleg
  - type: PowerArmorPart
    partType: LLeg

- type: entity
  id: PowerArmorRLegBase
  parent: PowerArmorPartBase
  abstract: true
  components:
  - type: Sprite
    layers: 
    - map: [ "enum.PowerArmorVisualLayers.RLeg"]
      offset: -0.125, 0.25
      state: rleg
  - type: PowerArmorPart
    partType: RLeg

#region NanoTrasen
- type: entity
  id: PowerArmorNTJuggernaut
  parent: PowerArmorPartBase
  name: NanoTrasen Heavy Hardsuit
  description: A piece of Powered Armor, if you're looking at this, you've either made a brand new piece or something has gone horribly wrong. Some Assembly Required.
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/PowerArmor/ntjuggsuit.rsi
  - type: PowerArmorPart
    modifiers:
      flatReductions:
        Piercing: 5
        Heat: 4
      coefficients:
        Blunt: 0.2
        Slash: 0.2
        Piercing: 0.2
        Heat: 0.2
        Radiation: 0.2
        Caustic: 0.2
    brokenModifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70 
        Heat: 0.80
        Radiation: 0.25
    speedModifier: 0.085 #Formula for this speed reduction would be like 0.6 (Armor) * (0.085 * Parts installed) with 6 = 0.306

- type: entity
  id: PowerArmorNTJuggernautLimbs
  parent: PowerArmorNTJuggernaut
  abstract: true
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Repairable
    damageValue: -20 
    doAfterDelay: 1
    fuelCost: 5.0


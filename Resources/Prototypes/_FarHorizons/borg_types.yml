#region Medical
- type: borgType
  id: medicalNS

  # Description
  dummyPrototype: BorgChassisMedical

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModuleTool # Far Horizons - we love our cyborgs actually
  - BorgModuleChemical
  - BorgModuleTopicals

  radioChannels:
  - SyndiSci
  - SyndiMed

  addComponents:

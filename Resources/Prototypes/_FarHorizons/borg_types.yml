#region ## NanoTrasen ##









#region Security
- type: borgType
  id: security
#
  # Description
  dummyPrototype: BorgChassisSecurity

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSecurity

  defaultModules:
  - BorgModuleTool
  - BorgModuleBaton
  - BorgModuleDominator

  radioChannels:
  - Science
  - Security

  # Visual
  inventoryTemplateId: borgShort
  spritePath: _FarHorizons/Mobs/Silicon/Chassis/security.rsi

  # Pet
  petSuccessString: petting-success-security-cyborg
  petFailureString: petting-failure-security-cyborg

  # Components
  addComponents:
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: FlashImmunity



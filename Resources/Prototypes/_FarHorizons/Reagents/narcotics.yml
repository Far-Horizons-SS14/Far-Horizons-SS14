  contrabandSeverity: Syndicate
  flavor: metallic
  color: "#a3a162"
  metabolisms:
    Bloodstream:
      effects:
      - !type:CauseDisease 
        conditions: 
        - !type:ReagentCondition
            reagent: Chitinen
            min: 13
        disease: DiseaseKerosilDefense
        probability: 1


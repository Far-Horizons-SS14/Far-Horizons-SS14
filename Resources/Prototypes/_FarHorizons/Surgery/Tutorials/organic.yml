# region Healing

- type: surgeryTutorial
  id: SurgeryTutorialTendBruteWound
  name: Tend Brute Wounds
  finishers:
    - SurgeryTutorialFinisherTendWounds
  conditions:
    - !type:SurgeryLimbHasDamage
      types:
        - Blunt
        - Piercing
        - Slash
  steps:
    - &makeIncision
      step: SurgeryMakeIncision
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalIncision
    - &clampAfterIncisionBeforeDeepIncision
      step: SurgeryClampBleeding
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalIncision
        - !type:SurgeryConditionOr
          conditions:
          - &noBleeding
            !type:SurgeryLimbHasStatus
            inverse: true
            statuses:
              - LimbStatusEffectBleedI
              - LimbStatusEffectBleedII
              - LimbStatusEffectBleedIII
          - !type:SurgeryLimbHasStatus
            statuses:
              - LimbStatusEffectSurgicalDeepIncision
    - &deepIncision
      step: SurgeryDeepenIncision
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalDeepIncision
    - step: SurgeryTendBrute
      conditionComplete:
        - !type:SurgeryLimbHasDamage
          inverse: true
          types:
            - Blunt
            - Piercing
            - Slash

- type: surgeryTutorial
  id: SurgeryTutorialTendBurnWound
  name: Tend Burn Wounds
  finishers:
    - SurgeryTutorialFinisherTendWounds
  conditions:
    - !type:SurgeryLimbHasDamage
      types:
        - Heat
        - Cold
        - Caustic
  steps:
    - *makeIncision
    - *clampAfterIncisionBeforeDeepIncision
    - *deepIncision
    - step: SurgeryTendBurn
      conditionComplete:
        - !type:SurgeryLimbHasDamage
          inverse: true
          types:
            - Heat
            - Cold
            - Caustic

# region Limbs

# Amputation

- type: surgeryTutorial
  id: SurgeryTutorialAmputateLimb
  name: Limb Amputation
  steps:
    - *makeIncision
    - &clampAfterIncisionBeforeIncisionOpen
      step: SurgeryClampBleeding
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalIncision
        - !type:SurgeryConditionOr
          conditions:
          - *noBleeding
          - !type:SurgeryLimbHasStatus
            statuses:
              - LimbStatusEffectSurgicalIncisionHeldOpen
    - &holdIncisionOpen
      step: SurgeryHoldIncisionOpen
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalIncisionHeldOpen
    - &detachVessels
      step: SurgeryDetachVessels
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalVesselsDetached
    - &clampAfterDetachVessels
      step: SurgeryClampBleeding
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalVesselsDetached
        - !type:SurgeryConditionOr
          conditions:
          - *noBleeding
          - !type:SurgeryLimbHasStatus
            statuses:
              - LimbStatusEffectSurgicalMuscleDetached
    - &detachMuscle
      step: SurgeryDetachMuscles
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalMuscleDetached
    - step: SurgeryAmputateLimb
      conditionComplete:
        - !type:ConditionNever


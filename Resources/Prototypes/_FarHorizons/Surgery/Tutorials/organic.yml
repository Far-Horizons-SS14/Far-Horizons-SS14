    - SurgeryTutorialFinisherHeart
  conditions:
    - !type:SurgeryHasOrgan
      category: Heart
  steps:
    - *makeIncision
    - *clampAfterIncisionBeforeIncisionOpen
    - *holdIncisionOpen
    - &openRibcage
      step: SurgeryOpenRibcage
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalRibcageOpen
    - &clampAfterOpenRibcageBeforeAorta
      step: SurgeryClampBleeding
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalRibcageOpen
        - !type:SurgeryConditionOr
          conditions:
            - *noBleeding
            - !type:SurgeryLimbHasStatus
              statuses:
                - LimbStatusEffectSurgicalAortaClamped
    - &clampAorta
      step: SurgeryClampAorta
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalAortaClamped
    - step: SurgeryRemoveHeart
      conditionComplete:
        - !type:SurgeryHasOrgan
          inverse: true
          category: Heart


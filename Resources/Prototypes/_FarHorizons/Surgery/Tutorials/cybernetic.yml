  name: Attach Left Arm
  finishers:
    - SurgeryTutorialFinisherCyberneticBasic
  conditions:
    - !type:SurgeryHasOrgan
      inverse: true
      category: ArmLeft
  steps:
    - *unscrewPlating
    - *weldLeakPlating
    - *pryPlatingOpen
    - &loosenBolts
      step: SurgeryLoosenBolts
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalBoltsLoosened
    - &weldLeakBolts
      step: SurgeryWeldLeaks
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalBoltsLoosened
        - !type:SurgeryConditionOr
          conditions:
            - *noLeaks
            - !type:SurgeryLimbHasStatus
              statuses:
                - LimbStatusEffectSurgicalJointsWelded
    - &weldJoints
      step: SurgeryWeldJoints
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalJointsWelded
    - step: SurgeryAttachLeftArmCyber
      conditionComplete:
        - !type:SurgeryHasOrgan
          category: ArmLeft


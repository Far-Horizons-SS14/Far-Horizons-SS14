# region Limbs

# Amputation

- type: surgeryTutorial
  id: SurgeryTutorialCyberneticAmputateLimb
  name: Limb Amputation
  steps:
    - &unscrewPlating
      step: SurgeryUnscrewPlating
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectPlatingUnscrewed
    - &weldLeakPlating
      step: SurgeryWeldLeaks
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectPlatingUnscrewed
        - !type:SurgeryConditionOr
          conditions:
            - &noLeaks
              !type:SurgeryLimbHasStatus
              inverse: true
              statuses:
                - LimbStatusEffectLeakingOilI
                - LimbStatusEffectLeakingOilII
                - LimbStatusEffectLeakingOilIII
            - !type:SurgeryLimbHasStatus
              statuses:
                - LimbStatusEffectSurgicalPlatingPried
    - &pryPlatingOpen
      step: SurgeryPryPlating
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalPlatingPried
    - &unscrewStructure
      step: SurgeryUnscrewStructure
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalStructureUnscrewed
    - &weldLeakStructure
      step: SurgeryWeldLeaks
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalStructureUnscrewed
        - !type:SurgeryConditionOr
          conditions:
            - *noLeaks
            - !type:SurgeryLimbHasStatus
              statuses:
                - LimbStatusEffectSurgicalLimbPoweredDown
    - &powerDownLimb
      step: SurgeryPowerDownLimb
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalLimbPoweredDown
    - step: SurgeryAmputateLimbCyber
      conditionComplete:
        - !type:ConditionNever


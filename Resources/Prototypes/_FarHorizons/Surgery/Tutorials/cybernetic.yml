# region Torso Organs

# Heart

- type: surgeryTutorial
  id: SurgeryTutorialCyberneticRemovePump
  name: Remove Pump
  finishers:
    - SurgeryTutorialFinisherCyberneticPump
  conditions:
    - !type:SurgeryHasOrgan
      category: Heart
  steps:
    - *unscrewPlating
    - *weldLeakPlating
    - *pryPlatingOpen
    - &disconnectHydraulics
      step: SurgeryDisconnectHydraulics
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalHydraulicsCut
    - &weldLeakHydraulics
      step: SurgeryWeldLeaks
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalHydraulicsCut
        - !type:SurgeryConditionOr
          conditions:
            - *noLeaks
            - !type:SurgeryLimbHasStatus
              statuses:
                - LimbStatusEffectSurgicalPumpPoweredDown
    - &powerDownPump
      step: SurgeryPowerDownPump
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          statuses:
            - LimbStatusEffectSurgicalPumpPoweredDown
    - step: SurgeryRemovePump
      conditionComplete:
        - !type:SurgeryHasOrgan
          inverse: true
          category: Heart

- type: surgeryTutorial
  id: SurgeryTutorialCyberneticImplantPump
  name: Install Pump
  finishers:
    - SurgeryTutorialFinisherCyberneticPump
  conditions:
    - !type:SurgeryHasOrgan
      inverse: true
      category: Heart
  steps:
    - *unscrewPlating
    - *weldLeakPlating
    - *pryPlatingOpen
    - *disconnectHydraulics
    - *weldLeakHydraulics
    - *powerDownPump
    - step: SurgeryImplantPump
      conditionComplete:
        - !type:SurgeryHasOrgan
          category: Heart
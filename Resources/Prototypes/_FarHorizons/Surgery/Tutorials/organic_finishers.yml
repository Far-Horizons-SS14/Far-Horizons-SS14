- type: surgeryTutorial
  id: SurgeryTutorialFinisherTendWounds
  name: Finish Tend Wounds
  steps:
    - &undoBleeding
      step: SurgeryClampBleeding
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          inverse: true
          statuses:
            - LimbStatusEffectBleedI
            - LimbStatusEffectBleedII
            - LimbStatusEffectBleedIII
    - &undoDeepIncision
      step: SurgeryCloseDeepIncision
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          inverse: true
          statuses:
            - LimbStatusEffectSurgicalDeepIncision
    - &undoIncision
      step: SurgeryCloseIncision
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          inverse: true
          statuses:
            - LimbStatusEffectSurgicalIncision

- type: surgeryTutorial
  id: SurgeryTutorialFinisherHandImplant
  name: Finish Hand Implant Surgery
  steps:
    - *undoBleeding
    - &reattachMuscle
      step: SurgeryReattachMuscles
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          inverse: true
          statuses:
            - LimbStatusEffectSurgicalMuscleDetached
    - &reattachVessels
      step: SurgeryReattachVessels
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          inverse: true
          statuses:
            - LimbStatusEffectSurgicalVesselsDetached
    - &closeOpenIncision
      step: SurgeryReleaseOpenIncision
      conditionComplete:
        - !type:SurgeryLimbHasStatus
          inverse: true
          statuses:
            - LimbStatusEffectSurgicalIncisionHeldOpen
    - *undoIncision

- type: surgeryTutorial
  id: SurgeryTutorialFinisherBasic
  name: Finish Surgery
  steps:
    - *undoBleeding
    - *closeOpenIncision
    - *undoIncision


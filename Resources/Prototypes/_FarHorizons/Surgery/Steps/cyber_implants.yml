# region Eyes

- type: surgeryStep
  parent: WrenchSurgery
  id: SurgeryRemoveEyeImplantCyber
  name: Remove Eye Implant
  baseTime: 4
  popup: surgery-remove-eye-implant-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalOpticsPoweredDown
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectLeakingOilI
        - LimbStatusEffectLeakingOilII
        - LimbStatusEffectLeakingOilIII
    - !type:SurgeryHasOrgan
      category: EyeImplant
  effects:
    - !type:SurgeryRemoveOrgan
      category: EyeImplant
    - !type:SurgeryProgressStatusChain
      needsToBeAlive: false
      chain: OilLeak

- type: surgeryStep
  id: SurgeryImplantEyeImplantCyber
  name: Implant Eye Implant
  baseTime: 3
  popup: surgery-implant-eye-implant-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalOpticsPoweredDown
    - !type:SurgeryHasOrgan
      inverse: true
      category: EyeImplant
  softConditions:
    - !type:SurgeryOrganHeld
      category: EyeImplant
  effects:
    - !type:SurgeryInsertOrgan


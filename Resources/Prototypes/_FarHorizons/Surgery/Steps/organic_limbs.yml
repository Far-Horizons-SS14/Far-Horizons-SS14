# region Amputation

- type: surgeryStep
  parent: HemostatSurgery
  id: SurgeryDetachVessels
  name: Detach Vessels
  baseTime: 2
  popup: surgery-detach-vessels-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalIncisionHeldOpen
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectBleedI
        - LimbStatusEffectBleedII
        - LimbStatusEffectBleedIII
        - LimbStatusEffectSurgicalVesselsDetached
        - LimbStatusEffectSurgicalCutOpticNerve
        - LimbStatusEffectSurgicalFacialBonesCut
        - LimbStatusEffectSurgicalFacialBonesRepositioned
  effects:
    - !type:SurgeryApplyLimbStatus
      statuses:
        - LimbStatusEffectSurgicalVesselsDetached
    - !type:SurgeryProgressStatusChain
      chain: Bleed

- type: surgeryStep
  parent: HemostatSurgery
  id: SurgeryReattachVessels
  name: Reattach Vessels
  baseTime: 1
  popup: surgery-reattach-vessels-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalVesselsDetached
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectBleedI
        - LimbStatusEffectBleedII
        - LimbStatusEffectBleedIII
        - LimbStatusEffectSurgicalMuscleDetached
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalVesselsDetached

- type: surgeryStep
  parent: ScalpelSurgery
  id: SurgeryDetachMuscles
  name: Detach Muscles
  baseTime: 2
  popup: surgery-detach-muscles-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalVesselsDetached
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectSurgicalMuscleDetached
  effects:
    - !type:SurgeryApplyLimbStatus
      statuses:
        - LimbStatusEffectSurgicalMuscleDetached
    - !type:SurgeryPainEffect

- type: surgeryStep
  parent: RetractorSurgery
  id: SurgeryReattachMuscles
  name: Reattach Muscles
  baseTime: 1
  popup: surgery-reattach-muscles-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalMuscleDetached
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalMuscleDetached

- type: surgeryStep
  parent: BoneSawSurgery
  id: SurgeryAmputateLimb
  name: Amputate Limb
  baseTime: 4
  popup: surgery-amputate-limb-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalMuscleDetached
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectNecrosisLimb
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalIncision
        - LimbStatusEffectSurgicalIncisionHeldOpen
        - LimbStatusEffectSurgicalVesselsDetached
        - LimbStatusEffectSurgicalMuscleDetached
        - LimbStatusEffectBleedI
        - LimbStatusEffectBleedII
        - LimbStatusEffectBleedIII
    - !type:SurgeryDetachLimb
    - !type:SurgeryPainEffect

# region Attachment

- type: surgeryStep
  parent: BoneSetterSurgery
  id: SurgeryDislocateBones
  name: Dislocate Bones
  baseTime: 2
  popup: surgery-dislocate-bones-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalIncisionHeldOpen
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectSurgicalDislocatedBone
        - LimbStatusEffectSurgicalAbdomenAccessed
        - LimbStatusEffectSurgicalRibcageOpen
  effects:
    - !type:SurgeryApplyLimbStatus
      statuses:
        - LimbStatusEffectSurgicalDislocatedBone
    - !type:SurgeryProgressStatusChain
      chain: Bleed
    - !type:SurgeryPainEffect

- type: surgeryStep
  parent: BoneSetterSurgery
  id: SurgeryPositionBones
  name: Position Bones
  baseTime: 1
  popup: surgery-position-bones-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalDislocatedBone
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalDislocatedBone

- type: surgeryStep
  parent: BoneGelSurgery
  id: SurgeryApplyBoneGel
  name: Apply Bone Gel
  baseTime: 1
  popup: surgery-apply-bone-gel-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalDislocatedBone
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectSurgicalBoneGelApplied
  effects:
    - !type:SurgeryApplyLimbStatus
      statuses:
        - LimbStatusEffectSurgicalBoneGelApplied


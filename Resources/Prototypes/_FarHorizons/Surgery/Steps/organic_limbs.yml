- type: surgeryStep
  id: SurgeryAttachHead
  name: Attach Head
  baseTime: 3
  popup: surgery-attach-head-popup-message
  tool: []
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalDislocatedBone
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalBoneGelApplied
    - !type:SurgeryHasOrgan
      inverse: true
      category: Head
  softConditions:
    - !type:SurgeryOrganHeld
      category: Head
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalBoneGelApplied
        - LimbStatusEffectSurgicalDislocatedBone
    - !type:SurgeryInsertOrgan


# region Amputation

- type: surgeryStep
  parent: ScalpelSurgery
  id: SurgerySlimeAmputateLimb
  name: Amputate Limb
  baseTime: 4
  popup: surgery-slime-amputate-limb-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalIncisionHeldOpen
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectNecrosisLimb
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalIncision
        - LimbStatusEffectSurgicalIncisionHeldOpen
        - LimbStatusEffectBleedI
        - LimbStatusEffectBleedII
        - LimbStatusEffectBleedIII
    - !type:SurgeryDetachLimb
    - !type:SurgeryPainEffect

# region Specific Limbs Attachment

- type: surgeryStep
  id: SurgerySlimeAttachHead
  name: Attach Head
  baseTime: 3
  popup: surgery-attach-head-popup-message
  tool: []
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalIncisionHeldOpen
    - !type:SurgeryHasOrgan
      inverse: true
      category: Head
  softConditions:
    - !type:SurgeryOrganHeld
      category: Head
  effects:
    - !type:SurgeryInsertOrgan


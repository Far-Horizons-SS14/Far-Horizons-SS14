- type: surgeryStep
  parent: RetractorSurgery
  id: SurgeryInspectNecrosis
  name: Inspect Necrosis [Repeatable]
  baseTime: 4
  popup: surgery-inspect-necrosis-popup-message
  repeatable: true
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalDeepIncision
  softConditions:
    - !type:SurgeryHasUnadressedNecrosis
  effects:
    - !type:SurgeryApplyRandomNecrosisStatus

# Limb

- type: surgeryStep
  parent: SurgeryAmputateLimb
  id: SurgeryNecrosisAmputateLimb
  name: Amputate Rotten Limb
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalMuscleDetached
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectNecrosisLimb
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalIncision
        - LimbStatusEffectSurgicalIncisionHeldOpen
        - LimbStatusEffectSurgicalVesselsDetached
        - LimbStatusEffectSurgicalMuscleDetached
        - LimbStatusEffectBleedI
        - LimbStatusEffectBleedII
        - LimbStatusEffectBleedIII
        - LimbStatusEffectNecrosisLimb
    - !type:SurgeryDetachLimb
    - !type:SurgeryPainEffect
    - !type:SurgeryReduceNecrosisTime

# Slime Limb

- type: surgeryStep
  parent: SurgerySlimeAmputateLimb
  id: SurgerySlimeNecrosisAmputateLimb
  name: Amputate Rotten Limb
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalIncisionHeldOpen
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectNecrosisLimb
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalIncision
        - LimbStatusEffectSurgicalIncisionHeldOpen
        - LimbStatusEffectBleedI
        - LimbStatusEffectBleedII
        - LimbStatusEffectBleedIII
        - LimbStatusEffectNecrosisLimb
    - !type:SurgeryDetachLimb
    - !type:SurgeryPainEffect
    - !type:SurgeryReduceNecrosisTime

# Liver

- type: surgeryStep
  parent: SurgeryRemoveLiver
  id: SurgeryNecrosisRemoveLiver
  name: Remove Rotten Liver
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalHepaticArteryClamped
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectNecrosisLiver
    - !type:SurgeryHasOrgan
      category: Liver
  effects:
    - !type:SurgeryRemoveOrgan
      category: Liver
    - !type:SurgeryProgressStatusChain
      chain: Bleed
    - !type:SurgeryPainEffect
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectNecrosisLiver
    - !type:SurgeryReduceNecrosisTime


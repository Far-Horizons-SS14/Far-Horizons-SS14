# Tongue

- type: surgeryStep
  parent: SurgeryRemoveTongue
  id: SurgeryNecrosisRemoveTongue
  name: Remove Rotten Tongue
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalClampedLingualArtery
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses: 
        - LimbStatusEffectSurgicalIncisionHeldOpen
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectNecrosisTongue
    - !type:SurgeryHasOrgan
      category: Tongue
  effects:
    - !type:SurgeryRemoveOrgan
      category: Tongue
    - !type:SurgeryProgressStatusChain
      chain: Bleed
    - !type:SurgeryPainEffect
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectNecrosisTongue
    - !type:SurgeryReduceNecrosisTime
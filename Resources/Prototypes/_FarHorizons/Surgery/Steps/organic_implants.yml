# region Eyes

- type: surgeryStep
  parent: BoneSetterSurgery
  id: SurgeryRemoveEyeImplant
  name: Remove Eye Implant
  baseTime: 4
  popup: surgery-remove-eye-implant-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalCutOpticNerve
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectBleedI
        - LimbStatusEffectBleedII
        - LimbStatusEffectBleedIII
    - !type:SurgeryHasOrgan
      category: EyeImplant
  effects:
    - !type:SurgeryRemoveOrgan
      category: EyeImplant
    - !type:SurgeryProgressStatusChain
      chain: Bleed
    - !type:SurgeryPainEffect

- type: surgeryStep
  id: SurgeryImplantEyeImplant
  name: Implant Eye Implant
  baseTime: 3
  popup: surgery-implant-eye-implant-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalCutOpticNerve
    - !type:SurgeryHasOrgan
      inverse: true
      category: EyeImplant
  softConditions:
    - !type:SurgeryOrganHeld
      category: EyeImplant
  effects:
    - !type:SurgeryInsertOrgan


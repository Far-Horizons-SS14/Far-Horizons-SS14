# region Abdomen

- type: surgeryStep
  parent: ScalpelSurgery
  id: SurgeryAccessAbdomen
  name: Access Abdomen
  baseTime: 2
  popup: surgery-access-abdomen-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalIncisionHeldOpen
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectSurgicalAbdomenAccessed
        - LimbStatusEffectSurgicalRibcageOpen
  effects:
    - !type:SurgeryApplyLimbStatus
      statuses:
        - LimbStatusEffectSurgicalAbdomenAccessed
    - !type:SurgeryProgressStatusChain
      chain: Bleed
    - !type:SurgeryPainEffect

- type: surgeryStep
  parent: CauterySurgery
  id: SurgeryCloseAbdomen
  name: Close Abdomen
  baseTime: 1
  popup: surgery-close-abdomen-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalIncisionHeldOpen
    - !type:SurgeryLimbHasStatus
      statuses:
        - LimbStatusEffectSurgicalAbdomenAccessed
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses:
        - LimbStatusEffectSurgicalHepaticArteryClamped
        - LimbStatusEffectSurgicalKidneysAccessed
        - LimbStatusEffectSurgicalEsophagusCut
  effects:
    - !type:SurgeryRemoveLimbStatus
      statuses:
        - LimbStatusEffectSurgicalAbdomenAccessed

# region Cavity

- type: surgeryStep
  parent: BoneSetterSurgery
  id: SurgeryRemoveCavityItem
  name: Remove Cavity Item
  baseTime: 4
  popup: surgery-remove-cavity-item-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalAbdomenAccessed
    - !type:SurgeryHasOrgan
      category: Cavity
  effects:
    - !type:SurgeryRemoveOrgan
      category: Cavity

- type: surgeryStep
  id: SurgeryImplantCavityItem
  name: Insert Item Into Cavity
  baseTime: 3
  popup: surgery-implant-cavity-popup-message
  conditions:
    - !type:SurgeryLimbHasStatus
      statuses: 
        - LimbStatusEffectSurgicalAbdomenAccessed
    - !type:SurgeryLimbHasStatus
      inverse: true
      statuses: 
        - LimbStatusEffectSurgicalHepaticArteryClamped
        - LimbStatusEffectSurgicalKidneysAccessed
    - !type:SurgeryHasOrgan
      inverse: true
      category: Cavity
  softConditions:
    - !type:HeldItemNotSurgeryTool # Albeit funny, I don't want to risk accidentially implanting tool instead of using it
    - !type:HeldItemSize
      allowedSizes:
        - Tiny
        - Small
  effects:
    - !type:SurgeryInsertCustomOrgan
      category: Cavity
    - !type:SurgeryPainEffect


# region Organic

- type: entity
  id: BaseSurgeryTargetOrganic
  abstract: true
  components:
  - type: SurgeryTarget
    blockingSlots:
      - INNERCLOTHING
      - OUTERCLOTHING
    steps:
      - BasicOrganicStepPack
      - OrganicTorsoOrgansPack
      - OrganicTorsoLimbAttachmentPack
      - OrganicTendWoundPack
      - OrganicTorsoNecrosisPack
  - type: NecrosisSurgeryTarget
    necrosisTarget:
      Torso:
        - LimbStatusEffectNecrosisLiver
        - LimbStatusEffectNecrosisStomach
        - LimbStatusEffectNecrosisKidneys
      Head:
        - LimbStatusEffectNecrosisEyes
        - LimbStatusEffectNecrosisTongue
      ArmLeft: [ LimbStatusEffectNecrosisLimb ]
      ArmRight: [ LimbStatusEffectNecrosisLimb ]
      HandLeft: [ LimbStatusEffectNecrosisLimb ]
      HandRight: [ LimbStatusEffectNecrosisLimb ]
      LegLeft: [ LimbStatusEffectNecrosisLimb ]
      LegRight: [ LimbStatusEffectNecrosisLimb ]
      FootLeft: [ LimbStatusEffectNecrosisLimb ]
      FootRight: [ LimbStatusEffectNecrosisLimb ]
    necrosisStatusCost: 5m
    statusOrganDependency:
      LimbStatusEffectNecrosisLiver: Liver
      LimbStatusEffectNecrosisStomach: Stomach
      LimbStatusEffectNecrosisKidneys: Kidneys
      LimbStatusEffectNecrosisEyes: Eyes
      LimbStatusEffectNecrosisTongue: Tongue


- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoXenoborgsMaybeTraitorLingx2 #This is being used in TraitorLings gamePreset.
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
#    - id: Vampire # disabled until reworked
#      prob: 0.25
    - id: SubWizard
      prob: 0.05
    - id: Traitor #TraitorLing gamePreset requires minimum of 50 people. Let's add a small chance to get double amounts.
      prob: 0.2
    - id: SLChangeling
      prob: 0.2

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoChangelingsNoXenoborgs #This is being used in Traitor gamePreset.
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
#    - id: Vampire # disabled until reworked
#      prob: 0.25
    - id: SubWizard
      prob: 0.05

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseLambdaRule
  components:
  - type: RandomMetadata #this generates the random operation name cuz it's cool.
    nameSegments:
    - NamesOperationPrefix
    - NamesOperationSuffix
    nameFormat: name-format-nuclear-operation
  - type: NukeopsRule
    greetingMessage: lambda-welcome
  - type: RuleGrids
  - type: AntagSelection
  - type: AntagLoadProfileRule
    speciesOverride: Human

- type: entity
  parent: BaseLambdaRule
  id: Lambda
  components:
  - type: GameRule
    minPlayers: 20
    faction: FactionSyndicate
    denyGameRules:
    - AbductorsSpawn
  - type: DynamicRule
    minRuleInterval: 18000 # set to 5 hours to avoid regenerating nukie bases
    maxRuleInterval: 18000 # set to 5 hours to avoid regenerating nukie bases
    table: !type:GroupSelector
      children:
      - id: NukiePlanetSpawn # TODO - replace with blukie map
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ NukeopsCommander ]
      fallbackRoles: [ Nukeops, NukeopsMedic ]
      spawnerPrototype: SpawnPointNukeopsCommander
      startingGear: ConsortiumCommanderGearFull
      roleLoadout:
      - RoleSurvivalLambda
      components:
      - type: NukeOperative
        syndStatusIcon: ConsortiumFaction
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateElite # TODO - replace with blue names??
        nameFormat: name-format-nukie-commander
      - type: NpcFactionMember
        factions:
        - Consortium
      mindRoles:
      - MindRoleLambdaCommander
    - prefRoles: [ NukeopsMedic ]
      fallbackRoles: [ Nukeops, NukeopsCommander ]
      spawnerPrototype: SpawnPointNukeopsMedic
      startingGear: ConsortiumOperativeMedicFull
      roleLoadout:
      - RoleSurvivalLambda
      components:
      - type: NukeOperative
        syndStatusIcon: ConsortiumFaction
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal # TODO - replace with blue names??
        nameFormat: name-format-nukie-agent
      - type: NpcFactionMember
        factions:
        - Consortium
      mindRoles:
      - MindRoleLambdaMedic
    - prefRoles: [ Nukeops ]
      fallbackRoles: [ NukeopsCommander, NukeopsMedic ]
      spawnerPrototype: SpawnPointNukeopsOperative
      max: 4
      playerRatio: 16
      startingGear: ConsortiumOperativeGearFull
      roleLoadout:
      - RoleSurvivalLambda
      components:
      - type: NukeOperative
        syndStatusIcon: ConsortiumFaction
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal # TODO - replace with blue names??
        nameFormat: name-format-nukie-operator
      - type: NpcFactionMember
        factions:
        - Consortium
      mindRoles:
      - MindRoleLambda
  - type: DynamicRuleCost
    cost: 200

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseTraitorRuleNS
  components:
  - type: TraitorRule
    nanoTrasenFaction: NeoSol
    syndicateFaction: Consortium
    objectiveIssuers: TraitorCorporations # TODO: replace with blue corporations
    codewordFactionPrototypeId: Traitor # TODO: replace with blue codewords
    storeProto: StorePresetConsortiumRemoteUplink
    implantProto: ConsortiumUplinkImplant
    uplinkCatalogProto: ConsortiumUplinkUplinkImplanter
    currencyProto: Refinedbluespacecrystal
    greetingMessage: traitor-role-greeting-ns
    codewordsMessage: traitor-role-codewords-ns
  - type: AntagRandomObjectives
    sets:
    - groups: TraitorObjectiveGroups # TODO: Add separate objectives
    maxDifficulty: 5
  - type: AntagSelection
    agentName: traitor-round-end-agent-name
  - type: DynamicRuleCost
    cost: 100

- type: entity
  parent: BaseTraitorRuleNS
  id: TraitorNS
  components:
  - type: GameRule
    minPlayers: 5
    faction: FactionSyndicate
    delay:
      min: 240
      max: 420
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Traitor ]
      max: 8
      playerRatio: 10
      blacklist:
        components:
        - AntagImmune
      lateJoinAdditional: false
      mindRoles:
      - MindRoleTraitorNS
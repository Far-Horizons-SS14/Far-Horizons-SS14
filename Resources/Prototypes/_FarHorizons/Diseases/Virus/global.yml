- type: disease
  id: DiseaseCold
  name: disease-DiseaseCold-name
  desc: disease-DiseaseCold-desc
  strainName: COVID-2077
  strainId: covid2077
  vector: Virus
  symptoms:
  - symptom: SymptomCough
    probability:
      1: 0.02
      2: 0.04
  - symptom: SymptomSneeze
    probability:
      1: 0.02
      2: 0.04
  - symptom: SymptomFever
  cureSteps:
  - !type:CureConditions
    conditions:
    - !type:CureReagent
      reagent: Salbutamol
      min: 10
    - !type:CureTemperature
      max: 308.15
  - !type:CureWait
    requiredTicks: 900
  - !type:CureBedrest
      bedrestChance: 0.00066 #Abysmally Low to have an average of 300 ticks before a heal if they sleep
      sleepMultiplier: 5
  stealth: [ Hidden ]
  spreadPath: [ Airborne ]


- type: diseaseSymptom
  id: SymptomCough
  name: disease-symptom-SymptomCough-name
  tier: 1
  stats:
    stealth: -1
    resistance: 3
    speed: 1
    transmittable: 2
  onlyAlive: true
  airborneBurst:
    rangeMultiplier: 1.75
    chanceMultiplier: 1.5
  behaviors:
  - !type:SymptomStatusEffect
    effects:
    - !type:Emote
      emote: Cough
      showInChat: true
    conditions:
    - !type:SymptomStageCondition
      min: 1
  - !type:SymptomStatusEffect
    effects:
    - !type:PopupMessage
      type: Local
      visualType: MediumCaution
      messages: [ "disease-sensation-throat-sore", "disease-sensation-throat-mucus" ]
    conditions:
    - !type:SymptomStageCondition
      min: 1
    probability: 0.01


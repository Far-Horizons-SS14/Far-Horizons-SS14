- type: shader
  id: GlitchingEffect
  kind: source
  path: "/Textures/_FarHorizons/Shaders/glitching_effect.swsl"
  params:
    sortPower: 0.03
    threshold: 0.005
    maxSteps: 30
    waveFrequency: 5.0
    waveSpeed: 4.0
    waveAmplitude: 0.001
    vignettePower: 1.3
    vignetteFalloff: 1.5

- type: shader
  id: LimbTargetting
  kind: source
  path: "/Textures/_FarHorizons/Shaders/limb_targetting.swsl"
  params:
    width: 0.75
    outerColor: 0, 1, 0
    innerFill: false
    innerColor: 0, 1, 0
    lineSpeed: 5
    lineFreq: 40000
    colorFactor: 0.5

- type: shader
  id: HeatDistortionFH # stuck the "FH" on the end in case upstream decides to make a HeatDistortion shader
  kind: source
  path: "/Textures/_FarHorizons/Shaders/heat_distortion.swsl"

- type: shader
  id: TelegraphedAttackProgress
  kind: source
  path: "/Textures/_FarHorizons/Shaders/telegraphed_attack_progress.swsl"
  params:
    progress: 0.0
    baseColor: 1, 0, 0
    alpha_outside: 0.1
    alpha_inside: 0.3
    alpha_edge: 0.8
    edge_thickness: 0.03
    edge_feather: 0.01

- type: shader
  id: TelegraphedAttackContinuous
  kind: source
  path: "/Textures/_FarHorizons/Shaders/telegraphed_attack_continuous.swsl"
  params:
    progress: 0.0
    baseColor: 1, 0, 0
    alpha_outside: 0.1
    alpha_inside: 0.3
    alpha_edge: 0.8
    edge_thickness: 0.03
    edge_feather: 0.01
    line_frequency: 20
    line_speed: 1.5
    line_thickness: 0.3
    line_alpha_boost: 0.15

- type: shader
  id: BossVFXElderInnerCircle
  kind: source
  path: "/Textures/_FarHorizons/Shaders/elder_circular_vfx.swsl"
  params:
    color1: 0.25, 0.1, 0.3
    color2: 0, 0, 0
    noise_scale: 0.1
    time_scale: 0.3
    hole_threshold: 0.4
    outerCircle: false
    range: 10.0

- type: shader
  id: BossVFXElderOuterCircle
  kind: source
  path: "/Textures/_FarHorizons/Shaders/elder_circular_vfx.swsl"
  params:
    color1: 0.25, 0.1, 0.3
    color2: 0, 0, 0
    noise_scale: 0.1
    time_scale: 0.3
    hole_threshold: 0.4
    outerCircle: true
    range: 7
    falloff_width: 2.5

- type: shader
  id: MainSequenceStar
  kind: source
  path: "/Textures/_FarHorizons/Shaders/StarSystem/main_sequence_star.swsl"
  params:
    parallaxFactor: 0.05
    solarRadiusFactor: 25.0

- type: shader
  id: GasGiant
  kind: source
  path: "/Textures/_FarHorizons/Shaders/StarSystem/gas_giant.swsl"
  params:
    parallaxFactor: 0.05
    planetaryRadiusFactor: 1.0
    hueShiftMultiplier: 0.1
    saturationShiftMultiplier: 0.1
    shadowSoftness: 0.25
    rotationSpeed: 0.005
    rimGlowStrength: 0.75
    axialPitch: 1.7
    ringDensity: 0.85
    perspectiveStrength: 0.013

- type: shader
  id: IceGiant
  kind: source
  path: "/Textures/_FarHorizons/Shaders/StarSystem/ice_giant.swsl"
  params:
    parallaxFactor: 0.05
    planetaryRadiusFactor: 1.0
    hueShiftMultiplier: 0.1
    saturationShiftMultiplier: 0.1
    shadowSoftness: 0.25
    rotationSpeed: 0.005
    rimGlowStrength: 0.75
    axialPitch: 1.7
    ringDensity: 0.85
    perspectiveStrength: 0.013
    atmosphereDepth: 0.01

- type: shader
  id: RockyPlanet
  kind: source
  path: "/Textures/_FarHorizons/Shaders/StarSystem/rocky_planet.swsl"
  params:
    parallaxFactor: 0.1
    planetaryRadiusFactor: 5.0
    hueShiftMultiplier: 0.1
    saturationShiftMultiplier: 0.1
    shadowSoftness: 0.25
    rotationSpeed: 0.005
    rimGlowStrength: 0.75
    axialPitch: 1.7
    ringDensity: 0.85
    perspectiveStrength: 0.013
    roughness: 0.5
    atmosphereSunScattering: 2.5
    atmosphereHeightFalloff: 3.5
    cloudSpeed: 0.01
    cloudHeight: 0.02
    cloudShadowStrength: 0.8
    polarCapNoiseScale: 0.5

- type: shader
  id: AsteroidBelt
  kind: source
  path: "/Textures/_FarHorizons/Shaders/StarSystem/asteroid_belt.swsl"
  params:
    bandFrequency: 6.0
    bandNoiseScale: 4.0
    edgeFeatherPower: 0.25
    beltRotationSpeed: 0.0001
    mistScale: 0.15
    mistDensity: 0.1
    mistCoverage: 1.35
    specksScale: 2.5
    specksThreshold: 0.5
    specksSpeedMultiplier: 2.25
    boulderGridScale: 1.5
    boulderDensity: 0.05
    boulderMaxRadius: 1.5
    boulderSpeedMultiplier: 1.25

- type: shader
  id: HologramFH
  kind: source
  path: "/Textures/_FarHorizons/Shaders/hologram.swsl"
  params:
    alpha: 0.9
    width: 0.75
    colorFactor: 0.5
    lineSpeed: 5
    lineFreq: 40000
    glitchSpeed: 1
    glitchFreq: 1000
    glitchThreshold: 0.99
    burstSpeed: 0.419
    burstThreshold: 0.75
    pixelShift: 1

- type: shader
  id: HologramFH_unshaded

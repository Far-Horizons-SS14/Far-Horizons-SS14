- type: markingsGroup
  id: IPC
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
      default: [ ScreenBsod ]
    enum.HumanoidVisualLayers.Head:
      limit: 1
      required: true
      default: [ MarkingStandardHead ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceIPC
  name: IPC Appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganIPCTorso
      Head: OrganIPCHead
      ArmLeft: OrganIPCArmLeft
      ArmRight: OrganIPCArmRight
      HandRight: OrganIPCHandRight
      HandLeft: OrganIPCHandLeft
      LegLeft: OrganIPCLegLeft
      LegRight: OrganIPCLegRight
      FootLeft: OrganIPCFootLeft
      FootRight: OrganIPCFootRight
      Eyes: OrganIPCEyes
      Tongue: OrganIPCTongue
      Ears: OrganIPCEars
      Heart: OrganIPCHeart
  - type: HumanoidProfile
    species: IPC
  - type: Sprite
    drawdepth: Mobs
    sprite: _FarHorizons/Mobs/Species/IPC/parts.rsi
    layers:
    # Torso
    - map: [ "enum.HumanoidVisualLayers.Chest" ]

    # Head
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]

    # Limbs
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]

    # Underwear & clothing
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
    - map: ["jumpsuit"]

    # Extremities
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: ["enum.HumanoidVisualLayers.RHand"]

    # Stuff that goes over the body but below equipment
    - map: ["enum.HumanoidVisualLayers.BodyCover"] # Far Horizons
    - map: ["enum.HumanoidVisualLayers.BodyCoverCover"] # Far Horizons
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.FaceCover" ] # Far Horizons
    - map: [ "enum.HumanoidVisualLayers.FaceCoverCover" ] # Far Horizons
    - map: ["enum.HumanoidVisualLayers.Overlay"]

    # More equipment
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "eyes" ]
    - map: [ "rig" ] #FarHorizons
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "back" ]
    - map: [ "neck" ]
    - map: [ "pin" ] #FarHorizons
    - map: [ "suitstorage" ]

    # Stuff that goes in front of equipment
    - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      shader: HologramFH
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
      shader: HologramFH
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Wings" ] # Far Horizon
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "enum.HumanoidVisualLayers.TailCover" ] # Far Horizons
    - map: [ "enum.HumanoidVisualLayers.TailOverlay" ]

    # Stuff that goes in front of stuff that goes in front of equipment
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]

    - map: ["enum.BorgVisualLayers.Body"]
      state: light
      visible: false
    - map: ["enum.BorgVisualLayers.Light"]
      state: light
      shader: unshaded
      visible: false
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi # Would do a custom dog handcuff sprite but unfortunately handcuffs have their overlay baked-in to the cuff itself so this is mostly filler
      state: body-overlay-2
      visible: false
    - map: ["enum.BorgVisualLayers.LightStatus"]
      state: light
      shader: unshaded
      visible: false
    - map: [ "clownedon" ] # Dynamically generated
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false

- type: entity
  parent:
  - ActiveCritBase
  - AppearanceIPC
  - BaseMobIPC
  id: MobIPC
  name: Urist McRobot
  components:
    - type: FluidFootprintSpreader
      footprint: Robot
      stepSpacing: 0.2
      lateralOffset: 0.15

# Organs

- type: entity
  parent: OrganBase
  id: OrganIPC
  abstract: true
  suffix: IPC
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Oil
        Quantity: 10
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: Oil
        Quantity: 10

- type: entity
  parent: OrganIPC
  id: OrganIPCInternal
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/IPC/organs.rsi

- type: entity
  parent: OrganIPC
  id: OrganIPCExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/IPC/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _FarHorizons/Mobs/Species/IPC/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: IPC

- type: entity
  id: DamageableLimbVisualsIPC
  abstract: true
  components:
    - type: LimbDamageVisuals
      damageOverlayGroups:
        Brute:
          rsi: /Textures/Mobs/Effects/brute_damage.rsi
          color: "#B67823"

# Limbs

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganIPCExternal ]
  id: OrganIPCTorso
  components:
  - type: Tag
    tags:
      - Inorganic

- type: entity
  parent: [ DamageableLimbVisualsIPC, OrganBaseHeadNonVitalNonEdible, OrganIPCExternal ]
  id: OrganIPCHead
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/IPC/blank.rsi
    state: blank
  - type: VisualOrgan
    data:
      sprite: _FarHorizons/Mobs/Species/IPC/blank.rsi
      state: blank
  - type: Tag
    tags:
      - Inorganic
  - type: LimbDamageEffect
    effects:
      - effect: !type:LimbEffectDetach
        condition: !type:LimbConditionSpecificDamage
          damageType: Slash
          damageAmount: 100 # -50 over base since it's non vital
      - effect: !type:LimbEffectDestroy
        condition: !type:LimbConditionOr
          conditions:
            - !type:LimbConditionSpecificDamage
              damageType: Blunt
              damageAmount: 250
            - !type:LimbConditionSpecificDamage
              damageType: Heat
              damageAmount: 2000 # +500 over base

- type: entity
  parent: [ DamageableLimbVisualsIPC, OrganBaseArmLeftNonEdible, OrganIPCExternal ]

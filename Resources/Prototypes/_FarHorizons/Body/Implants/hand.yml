- type: entity
  id: BaseClawImplant
  parent: BaseEntityHandImplant
  abstract: true
  components:
    - type: UserInterface
      interfaces:
        enum.LimbItemToggleMenuUiKey.Key:
          type: CyberLimbSystemItemsRadial
    - type: LimbItemDeployer
      action: ActionToggleClaws
      sound: ClawsUnsheathe
      handWhitelist:
        tags:
          - CyberHandItem
      stateOn: l_ripper_arm_SURG
      stateOff: l_ripper_arm

- type: entity
  id: LeftHandImplantHypoClaws 
  name: Left Hand HypoClaws Implant 
  description: Gives you retractable Hypo Claws!
  parent: BaseClawImplant
  components:
  - type: Sprite
    state: l_hand_implant_claws 
  - type: Organ 
    category: HandLeftImplant 
  - type: LimbItemStorage
    items:
      - HypoClaws

- type: entity
  id: RightHandImplantHypoClaws 
  name: Right Hand HypoClaws Implant 
  description: Gives you retractable Hypo Claws!
  parent: BaseClawImplant
  components:
  - type: Sprite
    state: r_hand_implant_claws 
  - type: Organ 
    category: HandRightImplant 
  - type: LimbItemStorage
    items:
      - HypoClaws
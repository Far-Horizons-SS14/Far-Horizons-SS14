#region implanters

- type: entity
  parent: CrateSecgearNS
  id: CrateSecurityTrackingMindshieldImplantsNS
  name: Implanter Crate
  description: Contains 4 NeoSol MindShield implants and 4 tracking implant. Requires Security access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MindShieldImplanterNS
          amount: 4
        - id: TrackingImplanter
          amount: 4

- type: entity
  parent: CrateSecgearNT
  id: CrateSecurityTrackingMindshieldImplants
  name: implanter crate
  description: Contains 4 NanoTrasen MindShield implants and 4 tracking implant. Requires Security access to open. # FH
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MindShieldImplanter
          amount: 4
        - id: TrackingImplanter
          amount: 4

#region NT armor
- type: entity
  parent: CrateSecgearNT
  id: CrateSecurityHelmet
  name: helmet crate
  description: Contains three standard-issue brain buckets. Requires Security access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingHeadHelmetBasic
          amount: 3

- type: entity
  parent: CrateSecgearNT
  id: CrateSecurityArmor
  name: armor crate
  description: Contains three bulletproof vests. Requires Security access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingOuterArmorBulletproof
          amount: 3
        - id: ClothingHeadHelmetBulletProof
          amount: 3


## Todo - Make some of these a bit less generic. I don't play most of the depts here, need to shape contents based on player feedback..

#region Basic
- type: entity 
  parent: BoxHug
  id: BoxHugIPC
  description: A special box for sensitive people with robotic needs.
  suffix: Emergency (IPC)
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Flare
        - id: EmergencyCoolingUnit
        - id: WelderMini
        - id: PowerCellSmall
  - type: Sprite
    layers:
    - state: box_hug

- type: entity 
  parent: BoxSurvival
  id: BoxMimeIPC
  suffix: Mime, Emergency (IPC)
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Flare
        - id: EmergencyCoolingUnit
        - id: WelderMini
        - id: PowerCellSmall
  - type: Sprite
    layers:
    - state: internals

- type: entity
  parent: BoxCardboard # Cannot fit 3x3 boxes into already-filled ERT backpacks.
  id: BoxSurvivalMilitaryDoubleIPC
  suffix: Military IPC
  description: It's a box with basic internals inside. This one is labelled to contain an double extended-capacity tank.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EmergencyCoolingUnit
        - id: WelderMini
        - id: PowerCellSmall
        - id: Flare
  - type: Sprite
    layers:
    - state: internals
    - state: extendedtank

#region Syndicate
- type: entity #🌟Starlight🌟
  parent: BoxSurvivalSyndicate

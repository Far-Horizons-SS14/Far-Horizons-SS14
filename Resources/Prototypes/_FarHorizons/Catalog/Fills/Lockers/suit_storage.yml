# region ## CFA ##
# Magistrate's Suit Storage Unit

- type: entity
  id: SuitStorageMagistrate
  parent: SuitStorageBaseFH
  name: High-Tech Suit Storage Unit
  description: A high-tech suit storage unit, this one appears to have been fresh-out of the factory, it's clearly been designed by the top artists in the sector. On the side of it is a large label that states, "For CFA Magistrate use only. - Concord Frontier Authority".
  suffix: Magistrate
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillMagistrateHardsuit
  - type: Sprite
    sprite: _FarHorizons/Structures/Storage/suit_storage.rsi
    layers:
    - state: magi
      map: ["enum.StorageVisualLayers.Base"]
    - state: door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: screen-cfa
      map: ["computerLayerScreen"]
  - type: EntityStorageVisuals
    stateDoorOpen: magi
  - type: AccessReader
    access: [["Magistrate"]]

- type: entityTable
  id: FillMagistrateHardsuit
  table: !type:AllSelector
    children:
    - id: ClothingOuterHardsuitMagistrate
    - id: ClothingMaskBreath
    - id: OxygenTankFilled
    - id: NitrogenTankFilled


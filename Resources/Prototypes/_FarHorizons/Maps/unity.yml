- type: gameMap
  id: FHUnity
  mapName: 'Unity'
  mapPath: /Maps/_FarHorizons/Stations/NeoSol/Unity.yml
  minPlayers: 0 #default is 35. since it's the only map, we want something to be shown in voting
  maxPlayers: 50
  faction: FactionSyndicate
  stations:
    FHUnity:
      stationProto: StandardNeosolStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Unity {1}'
          nameGenerator:
            !type:NeosolNameGenerator
            prefixCreator: '14'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_FarHorizons/Shuttles/unity-evac.yml
        - type: StationCargoShuttle
          path: /Maps/_FarHorizons/Shuttles/KillerTamashi-Cargo-Shuttle.yml
        - type: StationArrivals
          shuttlePath: /Maps/_FarHorizons/Shuttles/arrivals-neosol.yml

#region Carbon Burning
- type: fusionReaction
  id: C12+C12>...
  reactantA:
    proton: 6
    neutron: 6
  reactantB:
    proton: 6
    neutron: 6
  # The ratios for each reaction here are made up because I can't find answers for what they actually are
  energy: 3589920 # 4617000 * 0.6 + 2241000 * 0.35 + -2599000 * 0.04 + 13933000 * 0.01
  products:
    # ...>Ne20+He4
    10,10: 0.6 # 60% of an atom... don't question it
    2,2: 0.6

    # ...>Na23+H
    11,12: 0.35
    1,0: 0.35

    # ...>Mg23
    12,11: 0.04 # Rare due to it consuming energy

    # ...>Mg24
    12,12: 0.01 # Rare because of how uncommonly it doesn't break into one of the other reactions 
#endregion


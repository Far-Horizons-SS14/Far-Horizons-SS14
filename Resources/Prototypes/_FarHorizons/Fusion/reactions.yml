#region Oxygen Burning
- type: fusionReaction
  id: O16+O16>...
  reactantA:
    proton: 8
    neutron: 8
  reactantB:
    proton: 8
    neutron: 8
  # I actually have numbers for most of these, but I still took some creative liberties
  # https://en.wikipedia.org/wiki/Oxygen-burning_process
  energy: 7667290 # 9593000 * 0.34 + 7676000 * 0.56 + 1459000 * 0.04 + 381000 * 0.01 + -2409000 * 0.05 + 16539000 * 0.01
  products:
    # ...>Si28+He4
    14,14: 0.34
    2,2: 0.34

    # ...>P31+H
    15,16: 0.56
    1,0: 0.58
    
    # ...>S31
    16,15: 0.04
    
    # ...>Si30+2H
    14,16: 0.01
    # 1,0: 0.02 # added to the P31+H
    
    # ...>P30+D
    15,15: 0.04
    1,1: 0.04
    
    # ...>S32
    16,16: 0.01
#endregion


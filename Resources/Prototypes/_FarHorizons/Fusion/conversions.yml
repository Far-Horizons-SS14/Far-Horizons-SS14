- type: fusionConversion
  id: FusionConversionHyperNoblium
  gas: HyperNoblium
  products:
    # The production reaction, if taken literally, would mean that HyperNoblium's chemical formula is N10H5, which is horrifying for a number of reasons.
    # So, HyperNoblium is going to be the much more reasonable hydrazine (N2H4) and we're just going to ignore the fact that all nitrogen-hydrogen 
    # compounds are explosives and will definitely not stop reactions like HyperNoblium does.

    # Hydrogen
    1,0: 3.99942
    1,1: 0.00046
    1,2: 4e-16

    # Nitrogen
    7,7: 1.9924
    7,8: 0.0076

- type: fusionConversion
  id: FusionConversionProtoNitrate
  gas: ProtoNitrate # Why is it called protonitrate when it has NO nitrogen at all when making it
  products:
    # ProtoNitrate is carbonic acid (H2CO3) for the purpose of conversion

    # Hydrogen
    1,0: 1.99971
    1,1: 0.00023
    1,2: 2e-16

    # Carbon
    6,6: 0.989
    6,7: 0.0106
    6,8: 0.0004

    # Oxygen
    8,8: 2.9928
    8,9: 0.0012
    8,10: 0.006

- type: fusionConversion
  id: FusionConversionZauker
  gas: Zauker
  products:
    # Zauker is N7H9 (not named, but a real compound) for the purpose of conversion because I said so

    # Hydrogen
    1,0: 8.998695
    1,1: 0.001035
    1,2: 9e-16

    # Nitrogen
    7,7: 6.9734
    7,8: 0.0266

- type: fusionConversion
  id: FusionConversionHalon
  gas: Halon
  products:
    # Halon 1301 (CBrF3)
    # Carbon
    6,6: 0.989
    6,7: 0.0106
    6,8: 0.0004

    # Fluorine
    9,10: 3

    # Bromine
    # 35,44: 0.506
    # 35,46: 0.494

- type: fusionConversion
  id: FusionConversionHelium
  gas: Helium
  products:
    2,2: 0.999998
    2,1: 0.000002

- type: fusionConversion
  id: FusionConversionAntiNoblium
  gas: AntiNoblium
  products:
    # Antimatter HyperNoblium, woe be upon the engineer that shoves it into the fusion reactor unprepared
    # Also makes it so you can turn the fusion reactor into a ghetto AME but that probably won't be a problem... right?

    # Hydrogen
    -1,0: 3.99942
    -1,1: 0.00046
    -1,2: 4e-16

    # Nitrogen
    -7,7: 1.9924
    -7,8: 0.0076
#endregion
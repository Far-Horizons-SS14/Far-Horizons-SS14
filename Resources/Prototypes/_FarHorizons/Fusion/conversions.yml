# PREFACE
# Most of the conversions will result in making more than one isotope of the input atom. The 
# quantities of which are determined by their relative natural abundance which I got from Wikipedia.
# This is why Oxygen gas gives Oxygen-16, Oxygen-17, and Oxygen-18 and some gases give a wide 
# variety of atoms.
#
# Some elements, like Chlorine and Bromine, are not within the fusion reactions or decays, and are 
# excluded from products of the conversion.
# 
# Non-existent gasses like Frezon and Plasma were taken to be real-world alternatives like R-22 
# refrigerant and acetylene.

#region Base Gasses
- type: fusionConversion
  id: FusionConversionOxygen
  gas: Oxygen
  products:
    8,8: 1.9952
    8,9: 0.0008
    8,10: 0.004

- type: fusionConversion
  id: FusionConversionNitrogen
  gas: Nitrogen
  products:
    7,7: 1.9924
    7,8: 0.0076

- type: fusionConversion
  id: FusionConversionCO2
  gas: CarbonDioxide
  products:
    # Carbon
    6,6: 0.989
    6,7: 0.0106
    6,8: 0.0004

    # Oxygen
    8,8: 1.9952
    8,9: 0.0008
    8,10: 0.004

- type: fusionConversion
  id: FusionConversionPlasma
  gas: Plasma
  products:
    # Plasma is acetylene (C2H2) for the purposes of conversion

    # Hydrogen
    1,0: 1.99971
    1,1: 0.00023
    1,2: 2e-16

    # Carbon
    6,6: 1.978
    6,7: 0.0212
    6,8: 0.0008

- type: fusionConversion
  id: FusionConversionTritium
  gas: Tritium
  products:
    1,2: 1
  
- type: fusionConversion
  id: FusionConversionWater
  gas: WaterVapor
  products:
    # Hydrogen
    1,0: 1.99971
    1,1: 0.00023
    1,2: 2e-16

    # Oxygen
    8,8: 0.9976
    8,9: 0.0004
    8,10: 0.002

- type: fusionConversion
  id: FusionConversionAmmonia
  gas: Ammonia
  products:
    # Hydrogen
    1,0: 3.99942
    1,1: 0.00046
    1,2: 4e-16

    # Nitrogen
    7,7: 0.9962
    7,8: 0.0038

- type: fusionConversion
  id: FusionConversionNitrousOxide
  gas: NitrousOxide
  products:
    # Nitrogen
    7,7: 1.9924
    7,8: 0.0076

    # Oxygen
    8,8: 0.9976
    8,9: 0.0004
    8,10: 0.002

- type: fusionConversion
  id: FusionConversionFrezon
  gas: Frezon
  products:
    # Frezon is R-22 (CHClF2) for the purpose of conversion

    # Hydrogen
    1,0: 0.999855
    1,1: 0.000115
    1,2: 1e-16

    # Carbon
    6,6: 0.989
    6,7: 0.0106
    6,8: 0.0004

    # Fluorine
    9,10: 2

    # Chlorine
    # 17,18: 0.758
    # 17,20: 0.242
#endregion


- type: entity
  parent: BaseItem
  id: CyborgModuleSelector
  name: Undetermined Cyborg Module
  description: A small cyborg module with infinite possibilities.
  components:
  - type: Item
    storedRotation: -90
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#8FCBCB"
      - state: base-module-inhand-left
        color: "#A1A1A1"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#7D7D7D"
      right:
      - state: base-icon-inhand-right
        color: "#8FCBCB"
      - state: base-module-inhand-right
        color: "#A1A1A1"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#7D7D7D"
  - type: Sprite
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: generic
  - type: ThiefUndeterminedBackpack
    toolName: custom-frame-trait-module-compatibility-menu-selection
    toolDesc: custom-frame-trait-module-compatibility-menu-description
    maxSelectedSets: 1
    possibleSets:
    - ModuleCable
    - ModuleArtistry
    - ModuleTraversal
    - ModuleTool
    - ModuleInflatable
    - ModuleAppraisal
    - ModuleMining
    - ModuleConstruction
    - ModuleCustodial
    - ModuleCleaning
    - ModuleTopicals
    - ModuleChemical
    - ModuleArtifact
    - ModuleAnomaly
    - ModuleClowning
    - ModulePaperwork
    - ModuleBartending
    - ModuleBooks
    - ModuleBotany
    - ModuleCooking
    - ModuleMail
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

- type: thiefBackpackSet
  id: ModuleCable
  name: Cable Module
  description: A cyborg module dedicated to cable management.
  sprite:
    sprite: Objects/Specific/Robotics/borgmodule.rsi
    state: icon-cables
  content:
  - BorgModuleCable


# Tries to shoot a target at range.
- type: htnCompound
  id: GunCombatCompound
  branches:
    # Pick target, then move into range and shoot them.
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          operator: !type:JukeOperator
            jukeType: AdjacentTile

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

# Selects ammo in range, then moves to it and picks it up
- type: htnCompound
  id: PickupAmmoCompound
  branches:
    # Find ammo then pick it up.
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyAmmo

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:InteractWithOperator
            targetKey: Target
# TODO: Prioritise ammo for weapon we have equipped, otherwise grab anything if we don't have any.
# TODO: Only works on ballistic

# Selects a gun in range, then moves to it and picks it up.
- type: htnCompound
  id: PickupGunCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGuns

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandFreePrecondition
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:InteractWithOperator
            targetKey: Target

# TODO: Need a thing to recharge a laser gun
# TODO: When selecting pickup guns also add chargers or easy container grabs.

# Shorted version of RangedCombatCompound for entities that are guns themselves.
- type: htnCompound
  id: InnateRangedCombatCompound
  branches:
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound


- type: htnCompound
  id: RangedCombatCompound
  branches:
  #FH Start
    #If they see a gun and arent currently handling a gun go grab that gun
    - preconditions:
        - !type:ActiveHandEntityPrecondition
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
          invert: true
        - !type:ActiveHandComponentPrecondition
          components:
            - type: BallisticAmmoProvider
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGuns
        - !type:HTNPrimitiveTask
          operator: !type:DropOperator

    - preconditions:
        - !type:ActiveHandFreePrecondition
      tasks:
        - !type:HTNCompoundTask
          task: PickupGunCompound
  #FH-End

    # Close or rack the gun chamber if necessary
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        - !type:NeedToRackBoltPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:RackBoltOperator

    #FH-Start
    # Cycle a manual bolt if the gun cannot rack in one action.
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        - !type:NeedToCycleBoltPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:CycleBoltOperator

    # pump the gun if necessary
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        - !type:NeedToPumpPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PumpOperator
    #FH-End

    # Wield gun
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:WieldedPrecondition
          wielded: false
        # Far Horizons start - Don't wield an empty gun
        - !type:GunAmmoPrecondition
          minPercent: 0.001
        # Far Horizons end
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WieldOperator

    # Move to target and shoot them if ammo
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    # Reload gun
    # TODO

    # Equip a gun from inventory if one found, preferring over pickup.
    # TODO: Doing inventory cleanly will be a PITA so deferring to later
    # The issue is recursively checking items but also ignoring some recursive entities
    # i.e. we need to recursively go into storage containers.
    #- tasks:
    #   - !type:HTNCompoundTask
    #     task: ClearActiveHandCompound
    #
    #   - !type:HTNPrimitiveTask
    #     operator: !type:UtilityOperator
    #       proto: InventoryGuns
    #
    #   - !type:HTNPrimitiveTask
    #     operator: !type:EquipOperator

    # Pickup ammo if any nearby
    #- preconditions:
    #    - !type:GunAmmoPrecondition
    #      maxPercent: 0.0
    #  tasks:
    #    - !type:HTNCompoundTask
    #      task: ClearActiveHandCompound
#
#        - !type:HTNCompoundTask
#          task: PickupAmmoCompound

    # FH start
    # Not todo reload gun
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
            - type: ChamberMagazineAmmoProvider
        - !type:GunAmmoPrecondition
          maxPercent: 0.0
      tasks:
        - !type:HTNCompoundTask
          task: BeforeReloadCompound
        - !type:HTNCompoundTask
          task: ReloadMagazineGunCompound

    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
            - type: BallisticAmmoProvider
        - !type:GunAmmoPrecondition
          maxPercent: 0.0
      tasks:
        - !type:HTNCompoundTask
          task: BeforeReloadCompound
        - !type:HTNCompoundTask
          task: ReloadBallisticGunCompound

    # In case reload was interrupted by a replan this finished them swapping to their gun.
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: BallisticAmmoProvider
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
          invert: true
        - !type:KeyExistsPrecondition
          key: HeldGun
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:DropOperator
        - !type:HTNPrimitiveTask
          operator: !type:SwapToHandHoldingEntityOperator
            targetKey: HeldGun
    # FH end

    # Discard gun if no ammo
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:ActiveHandComponentPrecondition
           components:
            - type: MeleeWeapon
              damage:
                types:
                  Blunt: 0
           invert: true
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:DropOperator


- type: htnCompound
  id: FirebotCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: DouseFireTargetCompound
    # Far Horizons start
    - tasks:
        - !type:HTNCompoundTask
          task: PatrolBeaconCompound
    # Far Horizons end
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: DouseFireTargetCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyOnFire

        # Far Horizons start - menu speech toggle
        - !type:HTNCompoundTask
          task: FirebotSpeakCompound
        # Far Horizons end

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: InteractRange

        - !type:HTNPrimitiveTask
          operator: !type:SetFloatOperator
            targetKey: WaitTime
            amount: 1

        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: WaitTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: WaitTime

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:InteractWithOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: FireService
              proto: NearbyOnFire
              key: Target

# Far Horizons start - menu speech toggle
- type: htnCompound
  id: FirebotSpeakCompound
  branches:
    - preconditions:
        - !type:KeyExistsPrecondition
          key: SimpleBotSpeechEnabled
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:SpeakOperator
            speech: !type:SingleSpeakOperatorSpeech
              line: firebot-fire-detected
            hidden: true
    - tasks: []
# Far Horizons end

- type: htnCompound
  id: MedibotCompound
  branches:
  # Observe for targets
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: MedibotInjectable
        returnType: EnumerableDescending
    - !type:HTNPrimitiveTask
      operator: !type:PickNearbyInjectableOperator
        targetKey: Target
        targetMoveKey: TargetCoordinates

    - !type:HTNCompoundTask
      task: MedibotGetInRange
    - !type:HTNCompoundTask
      task: MedibotInject

  # Idle when targets not found
  # Far Horizons start
  - tasks:
    - !type:HTNCompoundTask
      task: PatrolBeaconCompound
  # Far Horizons end
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: htnCompound
  id: MedibotGetInRange
  branches:
    - tasks:
        # TODO: Kill this shit
        - !type:HTNPrimitiveTask
          operator: !type:PickNearbyInjectableOperator
            targetKey: InjectTarget
            targetMoveKey: TargetCoordinates

        #Starlight: Path before saying your line
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
        
        # Far Horizons start - menu speech toggle
        #- !type:HTNPrimitiveTask
        #  operator: !type:SpeakOperator
        #    speech: !type:SingleSpeakOperatorSpeech
        #      line: medibot-start-inject
        #    hidden: true
        - !type:HTNCompoundTask
          task: MedibotStartInjectSpeakCompound
        # Far Horizons end

        - !type:HTNPrimitiveTask
          operator: !type:SetFloatOperator
            targetKey: IdleTime
            amount: 3

# Should be called only when in range
- type: htnCompound
  id: MedibotInject
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:InteractWithOperator
        expectDoAfter: true
        targetKey: Target
    - !type:HTNPrimitiveTask
      operator: !type:EnsureComponentOperator
        targetKey: Target
        components:
        - type: NPCRecentlyInjected

# Far Horizons start - menu speech toggle
- type: htnCompound
  id: MedibotStartInjectSpeakCompound
  branches:
    - preconditions:
        - !type:KeyExistsPrecondition
          key: SimpleBotSpeechEnabled
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:SpeakOperator
            speech: !type:SingleSpeakOperatorSpeech
              line: medibot-start-inject
            hidden: true
    - tasks: []
# Far Horizons end

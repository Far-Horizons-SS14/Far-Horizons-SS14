name: Publish to CDN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 9.0.x

    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install requests
      run: pip install requests

    - name: Release
      shell: bash
      run: |
        mkdir out
        dotnet run --project Content.Packaging -c Release client
        mv release/SS14.Client.zip out/SS14.Client.zip
        dotnet run --project Content.Packaging -c Release server --platform linux-x64
        mv release/SS14.Server_linux-x64.zip out/SS14.Server_linux-x64.zip
        git rev-parse --short HEAD > out/VERSION
        sed -nr "s|.*<Version>(.*)</Version>.*|\1|p" RobustToolbox/MSBuild/Robust.Engine.Version.props > out/ENGINE_VERSION

    - name: Publish to CDN
      working-directory: ${{ github.workspace }}
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        ROBUST_CDN_URL: ${{ secrets.ROBUST_CDN_URL }}
        FORK_ID: "farhorizons"
        RELEASE_DIR: "out"
      run: python Tools/_FarHorizons/publish_multi_request.py
